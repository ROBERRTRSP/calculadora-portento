<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./porcento.css">
  <title>Leer factura · Porcento</title>
  <style>
    #file { font-size: 13px; padding: 6px; }
    #file::file-selector-button { background: var(--surface); color: var(--accent); font: inherit; font-weight: 650; border: 0; border-radius: 8px; min-height: 32px; padding: 5px 8px; margin-right: 7px; }
    #preview { display: block; max-width: 100%; max-height: 220px; margin: 10px auto 0; border-radius: 10px; }
    #status, .invoice-actions { margin-top: 8px; }
    .invoice-disclosure { margin-top: 8px; }
    .invoice-disclosure .caption { display: block; margin-top: 8px; }
    #items { margin-top: 8px; }
    .product { padding-top: 7px; border-top: 1px solid var(--hairline); }
    .product + .product { margin-top: 8px; }
    .product-title { display: flex; align-items: end; gap: 8px; margin-bottom: 7px; }
    .product-title .field { flex: 1; }
    .remove { flex: none; color: var(--negative); }
    .invoice-prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
    .invoice-prices > div { background: var(--tint); border-radius: 10px; text-align: center; padding: 5px; min-width: 0; }
    .invoice-prices .amount { display: block; color: var(--accent); }
    .invoice-options { display: flex; align-items: center; gap: 9px; min-height: 44px; margin: 4px 0 0; }
    .invoice-options input { appearance: auto; width: 20px; height: 20px; min-height: 0; margin: 0; accent-color: var(--accent); }
    .invoice-warning { margin: 7px 0; color: var(--negative); }
    #raw { min-height: 100px; resize: vertical; }
  </style>
</head>
<body>
  <main class="app">
    <a class="back" href="./index.html">‹ Porcento</a>
    <header class="page-header"><h1>Leer factura</h1></header>
    <section class="card" aria-label="Seleccionar factura">
      <label for="file">Foto o PDF de la factura</label>
      <input id="file" type="file" accept="image/*,application/pdf" capture="environment">
      <div class="actions invoice-actions">
        <button class="primary" id="ai" type="button">Leer con IA</button>
        <button id="read" type="button">Lector básico</button>
      </div>
      <label class="invoice-options"><input type="checkbox" id="smallPrint"> IA con ampliaciones para tickets largos o letra pequeña</label>
      <p id="status" class="status" role="status"></p>
      <img id="preview" hidden alt="Vista previa de la factura">
      <details class="invoice-disclosure" id="connection">
        <summary>Configurar lectura con IA</summary>
        <div class="details-body">
          <label for="endpoint">Dirección del servidor</label>
          <input id="endpoint" type="url" placeholder="https://tu-servidor.workers.dev">
          <button id="saveEndpoint" type="button">Guardar dirección</button>
          <small class="caption">Al usar IA, se envía la imagen al servidor configurado y al proveedor de IA.</small>
        </div>
      </details>
    </section>
    <section class="card" aria-labelledby="products-heading">
      <h2 id="products-heading">Productos</h2>
      <p id="invoiceSummary" class="status" aria-live="polite"></p>
      <div id="items"></div>
      <div class="actions invoice-actions">
        <button id="add" type="button">Añadir producto</button>
        <button id="export" type="button">Descargar CSV</button>
      </div>
    </section>
    <details class="card">
      <summary>Revisar texto leído</summary>
      <div class="details-body">
        <label for="raw">Texto de la factura</label>
        <textarea id="raw" placeholder="También puedes pegar texto aquí."></textarea>
        <button id="parse" type="button">Analizar texto</button>
      </div>
    </details>
  </main>
  <script src="./factura.js"></script>
  <script>
const $=id=>document.getElementById(id), money=n=>Number.isFinite(n)?'$'+n.toFixed(2):'—';let rows=[];$('endpoint').value=localStorage.getItem('porcento_ai_endpoint')||'';$('saveEndpoint').onclick=()=>{let v=$('endpoint').value.trim().replace(/\/$/,'');if(!/^https:\/\//.test(v)){$('status').textContent='La dirección debe comenzar con https://';return}localStorage.setItem('porcento_ai_endpoint',v);$('status').textContent='Dirección guardada.'};
function draw() {
  const items = $('items');
  items.replaceChildren();
  rows.forEach((row, index) => {
    const product = document.createElement('article');
    product.className = 'product';
    const heading = document.createElement('div');
    heading.className = 'product-title';
    const fields = document.createElement('div');
    fields.className = 'fields';

    function field(name, label, mode) {
      const wrapper = document.createElement('div');
      wrapper.className = 'field';
      const input = document.createElement('input');
      input.id = name + '-' + index;
      input.type = mode ? 'number' : 'text';
      if (mode) {
        input.inputMode = mode;
        input.min = mode === 'decimal' ? '0' : '1';
        input.step = mode === 'decimal' ? '.01' : '1';
      }
      input.value = row[name];
      input.addEventListener('input', () => {
        row[name] = input.value;
        recalc();
      });
      const caption = document.createElement('label');
      caption.htmlFor = input.id;
      caption.textContent = label;
      wrapper.append(caption, input);
      return wrapper;
    }

    const remove = document.createElement('button');
    remove.className = 'quiet remove';
    remove.type = 'button';
    remove.textContent = 'Eliminar';
    remove.setAttribute('aria-label', 'Eliminar producto ' + (index + 1));
    remove.onclick = () => { rows.splice(index, 1); draw(); };
    heading.append(field('nombre', 'Producto', ''), remove);
    fields.append(field('costo', 'Costo total ($)', 'decimal'), field('cantidad', 'Unidades', 'numeric'));
    const prices = document.createElement('div');
    prices.className = 'invoice-prices';
    prices.setAttribute('aria-label', 'Precio por margen');
    for (const margin of margins) {
      const cell = document.createElement('div');
      const label = document.createElement('small');
      label.textContent = margin + '%';
      const amount = document.createElement('strong');
      amount.className = 'amount';
      amount.dataset.margin = margin;
      cell.append(label, amount);
      prices.append(cell);
    }
    product.append(heading, fields);
    if (row.info) {
      const info = document.createElement('p');
      info.className = 'caption';
      info.textContent = row.info;
      product.append(info);
    }
    if (row.review) {
      const note = document.createElement('p');
      note.className = 'caption invoice-warning';
      note.textContent = row.warning || 'Confirma el costo y las unidades.';
      const confirm = document.createElement('button');
      confirm.type = 'button';
      confirm.textContent = 'Confirmar costo y unidades';
      confirm.onclick = () => {
        if (invoice.suggestedPrice(row.costo, row.cantidad, 33) === null) {
          note.textContent = 'Escribe un costo mayor que cero y un número entero de unidades.';
          return;
        }
        row.review = false;
        row.warning = '';
        note.remove();
        confirm.remove();
        recalc();
      };
      product.append(note, confirm);
    }
    product.append(prices);
    items.append(product);
  });
  recalc();
}

function recalc() {
  [...$('items').children].forEach((product, index) => {
    const row = rows[index];
    for (const amount of product.querySelectorAll('[data-margin]')) {
      const margin = Number(amount.dataset.margin);
      const price = row.review ? null : invoice.suggestedPrice(row.costo, row.cantidad, margin);
      amount.textContent = price === null ? '—' : money(price);
    }
  });
  updateInvoiceSummary();
}

const invoice = window.PorcentoFactura;
const margins = [33, 45, 50];
let printedTotal = null;
let documentNotes = [];

function displayInvoice(result, notes = []) {
  rows = result.rows;
  printedTotal = result.printed;
  documentNotes = Array.isArray(notes) ? notes.filter(note => typeof note === 'string').slice(0, 5) : [];
  draw();
  $('status').textContent = rows.length
    ? rows.length + (rows.length === 1 ? ' producto detectado.' : ' productos detectados.')
    : 'No pude identificar productos. Prueba una foto más cerca o añade un producto manualmente.';
}

function updateInvoiceSummary() {
  const complete = rows.filter(row => Number(row.costo) > 0);
  const sum = complete.reduce((total, row) => total + invoice.cents(Number(row.costo)), 0);
  const difference = printedTotal === null ? null : invoice.cents(printedTotal) - sum;
  const reviewCount = rows.filter(row => row.review || !Number(row.costo) || !Number(row.cantidad)).length;
  const balance = difference === null ? 'Total impreso sin verificar.'
    : difference === 0 && complete.length === rows.length ? 'Los importes cuadran con el total impreso.'
    : 'Revisa los importes. Diferencia con el total impreso: ' + money(Math.abs(difference) / 100) + '.';
  $('invoiceSummary').textContent = rows.length ? [
    'Importes leídos: ' + money(sum / 100) + '.',
    printedTotal === null ? '' : 'Total impreso: ' + money(printedTotal) + '.',
    balance,
    reviewCount ? reviewCount + (reviewCount === 1 ? ' producto por revisar.' : ' productos por revisar.') : '',
    ...documentNotes
  ].filter(Boolean).join(' ') : '';
  $('export').disabled = !rows.length;
}

const scripts = new Map();
function loadScript(url) {
  if (!scripts.has(url)) {
    const pending = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = url;
      script.onload = resolve;
      script.onerror = () => reject(Error('No se pudo cargar el lector.'));
      document.head.append(script);
    }).catch(error => { scripts.delete(url); throw error; });
    scripts.set(url, pending);
  }
  return scripts.get(url);
}

async function readCanvas(file) {
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d');
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    try {
      if (doc.numPages > 1) canvas.dataset.note = 'Se leyó la primera página del PDF.';
      const page = await doc.getPage(1);
      const natural = page.getViewport({ scale: 1 });
      const viewport = page.getViewport({ scale: Math.min(3, 3000 / Math.max(natural.width, natural.height)) });
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      await page.render({ canvasContext: context, viewport }).promise;
    } finally {
      await doc.destroy();
    }
    return canvas;
  }

  const image = new Image();
  const url = URL.createObjectURL(file);
  try {
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(Error('Usa una foto legible en JPEG o PNG.'));
      image.src = url;
    });
    const scale = Math.min(1, 3000 / Math.max(image.naturalWidth, image.naturalHeight));
    canvas.width = Math.round(image.naturalWidth * scale);
    canvas.height = Math.round(image.naturalHeight * scale);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function detailsOf(canvas) {
  const sections = 3;
  const height = Math.ceil(canvas.height * 0.39);
  return Array.from({ length: sections }, (_, index) => {
    const offset = Math.round((canvas.height - height) * index / (sections - 1));
    const crop = document.createElement('canvas');
    const zoom = Math.min(1.6, 2000 / canvas.width);
    crop.width = Math.round(canvas.width * zoom);
    crop.height = Math.round(height * zoom);
    crop.getContext('2d').drawImage(canvas, 0, offset, canvas.width, height, 0, 0, crop.width, crop.height);
    return crop.toDataURL('image/jpeg', .86);
  });
}

async function withInvoice(read) {
  const file = $('file').files[0];
  if (!file) {
    $('status').textContent = 'Selecciona una foto o PDF primero.';
    return;
  }
  $('ai').disabled = $('read').disabled = true;
  try {
    $('status').textContent = 'Preparando factura…';
    await read(await readCanvas(file));
  } catch (error) {
    $('status').textContent = error.message || 'No se pudo leer la factura.';
  } finally {
    $('ai').disabled = $('read').disabled = false;
  }
}

function preview(canvas) {
  const image = canvas.toDataURL('image/jpeg', .87);
  $('preview').src = image;
  $('preview').hidden = false;
  return image;
}

$('ai').onclick = () => {
  const endpoint = $('endpoint').value.trim().replace(/\/$/, '');
  if (!/^https:\/\//.test(endpoint)) {
    $('connection').open = true;
    $('endpoint').focus();
    $('status').textContent = 'Escribe la dirección del servidor de IA.';
    return;
  }
  return withInvoice(async canvas => {
    const image = preview(canvas);
    const details = $('smallPrint').checked ? detailsOf(canvas) : [];
    const body = JSON.stringify({ image, details });
    if (body.length >= 8_900_000) throw Error('La foto es muy pesada. Prueba una foto más ligera o lee el ticket por partes.');
    $('status').textContent = 'Leyendo los productos y sus importes…';
    const response = await fetch(endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
      signal: AbortSignal.timeout(120000)
    });
    const data = await response.json();
    if (!response.ok) throw Error(data.error || 'No se completó la lectura con IA.');
    if (!Array.isArray(data.productos) || !data.productos.length) throw Error('La IA no encontró productos. Prueba una foto más cerca.');
    displayInvoice(invoice.normalize(data), [canvas.dataset.note, ...(Array.isArray(data.observaciones) ? data.observaciones : [])]);
  });
};

$('read').onclick = () => withInvoice(async canvas => {
  preview(canvas);
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  $('status').textContent = 'Leyendo texto… puede tardar unos segundos.';
  const worker = await window.Tesseract.createWorker('eng+spa');
  try {
    const result = await worker.recognize(canvas);
    $('raw').value = result.data.text;
    displayInvoice(invoice.parseText(result.data.text), [canvas.dataset.note]);
  } finally {
    await worker.terminate();
  }
});
$('parse').onclick = () => displayInvoice(invoice.parseText($('raw').value));
$('add').onclick = () => { rows.push({ nombre: '', costo: '', cantidad: '' }); draw(); };
$('export').onclick = () => {
  const quote = value => {
    let text = String(value ?? '');
    if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g, '""') + '"';
  };
  const lines = [['Producto', 'Costo total', 'Unidades', 'Costo por unidad', '33%', '45%', '50%', 'Por revisar']];
  for (const row of rows) {
    const prices = margins.map(margin => row.review ? null : invoice.suggestedPrice(row.costo, row.cantidad, margin));
    lines.push([row.nombre, row.costo, row.cantidad,
      prices[0] === null ? '' : Number(row.costo) / Number(row.cantidad), ...prices, row.warning || (row.review ? 'Revisar' : '')]);
  }
  const csv = lines.map(line => line.map(quote).join(',')).join('\r\n');
  const download = document.createElement('a');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  download.href = url;
  download.download = 'porcento-factura.csv';
  download.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
updateInvoiceSummary();
  </script>
</body>
</html>
