<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./porcento.css?v=24">
  <title>Leer factura · Porcento</title>
  <style>
    #takePhoto { width: 100%; gap: 8px; min-height: 52px; font-size: 16px; }
    #takePhoto .icon { width: 22px; height: 22px; }
    #chooseFile { display: flex; margin: 0 auto; }
    #selectedInvoice { margin: 0 0 8px; text-align: center; }
    #selectedInvoice:empty { display: none; }
    #preview { display: block; max-width: 100%; max-height: 220px; margin: 10px auto 0; border-radius: 10px; }
    #status, .invoice-actions { margin-top: 8px; }
    .invoice-disclosure { margin-top: 8px; }
    .invoice-disclosure .caption { display: block; margin-top: 8px; }
    #items { margin-top: 8px; }
    #basicOptions { margin-top: 8px; }
    #basicOptions select { width: 100%; min-height: 44px; padding: 8px; border: 1px solid var(--hairline); border-radius: 10px; background: var(--field); color: inherit; font: inherit; }
    #totalPhotoStatus { margin-top: 4px; }
    #printedTotalEntry { margin-top: 10px; }
    #printedTotalEntry input { margin-bottom: 6px; }
    #invoiceSummary[data-state="review"] { color: var(--negative); }
    .product { padding-top: 7px; border-top: 1px solid var(--hairline); }
    .product + .product { margin-top: 8px; }
    .product-title { display: flex; align-items: end; gap: 8px; margin-bottom: 7px; }
    .product-title .field { flex: 1; }
    .remove { flex: none; color: var(--negative); }
    .invoice-prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
    .invoice-prices > div { background: var(--tint); border-radius: 10px; text-align: center; padding: 5px; min-width: 0; }
    .invoice-prices .amount { display: block; color: var(--accent); }
    .invoice-markup { margin-top: 6px; padding: 7px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .invoice-markup .amount { color: var(--accent); }
    .invoice-warning { margin: 7px 0; color: var(--negative); }
    #raw { min-height: 100px; resize: vertical; }
    .invoice-unit-cost { margin-top: 8px; }
    .save-to-catalog { margin-top: 6px; }
    .save-to-catalog .actions { align-items: end; }
    #catalogBatch { padding: 8px 0; }
    .catalog-choice { display: flex; align-items: center; gap: 8px; min-height: 44px; margin: 0; }
    .catalog-choice input { appearance: auto; width: 18px; min-height: auto; height: 18px; accent-color: var(--accent); }
  </style>
</head>
<body>
  <main class="app">
    <a class="back" href="./index.html">‹ Porcento</a>
    <header class="page-header"><h1>Leer factura</h1></header>
    <section class="card" aria-label="Capturar factura">
      <button class="primary" id="takePhoto" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-3h4l2 3h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Tomar foto de la factura
      </button>
      <button class="quiet" id="chooseFile" type="button">Usar foto o PDF guardado</button>
      <input id="cameraFile" type="file" accept="image/*" capture="environment" hidden>
      <input id="file" type="file" accept="image/*,application/pdf" hidden>
      <p id="selectedInvoice" class="caption" role="status"></p>
      <div class="actions invoice-actions">
        <button class="primary" id="read" type="button">Leer factura gratis</button>
      </div>
      <details class="invoice-disclosure" id="basicOptions">
        <summary>Ayudar al lector básico</summary>
        <div class="details-body">
          <label for="invoiceFormat">Formato de factura</label>
          <select id="invoiceFormat">
            <option value="">Detectar automáticamente</option>
            <option value="dairy">Jersey Dairy Express</option>
            <option value="aaa">AAA Wholesale</option>
            <option value="taino">Taíno Trading</option>
            <option value="rosas">Rosas Distribution</option>
            <option value="azmetro">AZ Metro Distributors</option>
          </select>
          <small class="caption" id="formatHint">Incluye los encabezados de la tabla y los importes. Si el total quedó fuera, añade una foto del total de la misma factura.</small>
          <button id="takeTotalPhoto" type="button">Tomar foto del total</button>
          <button class="quiet" id="removeTotalPhoto" type="button" hidden>Quitar foto del total</button>
          <input id="totalPhotoFile" type="file" accept="image/*" capture="environment" hidden>
          <p id="totalPhotoStatus" class="status" role="status"></p>
        </div>
      </details>
      <p id="status" class="status" role="status"></p>
      <img id="preview" hidden alt="Vista previa de la factura">
    </section>
    <section class="card" aria-labelledby="products-heading">
      <h2 id="products-heading">Productos</h2>
      <a class="back" href="./catalogo.html">Mi catálogo</a>
      <p id="invoiceSummary" class="status" aria-live="polite"></p>
      <form id="printedTotalEntry" hidden>
        <label for="printedTotal">Total impreso en la factura ($)</label>
        <input id="printedTotal" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
        <button type="submit">Comprobar total</button>
        <p id="totalInputStatus" class="status" role="status"></p>
      </form>
      <div id="catalogBatch" hidden>
        <div class="actions">
          <label class="catalog-choice"><input type="checkbox" id="selectCatalogRows">Seleccionar todos</label>
          <button id="saveCatalogRows" type="button" disabled>Guardar seleccionados</button>
        </div>
        <p id="catalogBatchStatus" class="status" role="status"></p>
      </div>
      <div id="items"></div>
      <div class="actions invoice-actions">
        <button id="add" type="button">Añadir producto</button>
        <button id="export" type="button">Descargar CSV</button>
      </div>
    </section>
    <details class="card">
      <summary>Revisar texto leído</summary>
      <div class="details-body">
        <label for="raw">Texto de la factura</label>
        <textarea id="raw" placeholder="También puedes pegar texto aquí."></textarea>
        <button id="parse" type="button">Analizar texto</button>
      </div>
    </details>
  </main>
  <script src="./factura.js?v=20"></script>
  <script src="./catalogo.js?v=25"></script>
  <script src="./barcode.js?v=24"></script>
  <script>
const $ = id => document.getElementById(id);
const money = n => Number.isFinite(n) ? '$' + n.toFixed(2) : '—';
let rows = [];
let displayedBatchBusy = false;

function catalogInput(row, costsVerified) {
  const cost = costsVerified && !row.review && !row.costUnconfirmed ? invoice.unitCost(row.costo, row.cantidad) : null;
  return {
    name: row.nombre ?? '', code: row.codigoTipo === 'interno' ? '' : row.codigo ?? '',
    cost, sale: row.catalogSale ?? '',
    purchase: cost === null ? null : { cents: invoice.moneyCents(row.costo), units: Number(row.cantidad) }
  };
}

function updateCatalogSelection() {
  const selected = rows.filter(row => row.catalogSelected).length;
  const all = $('selectCatalogRows');
  $('catalogBatch').hidden = rows.length < 2;
  all.checked = rows.length > 0 && selected === rows.length;
  all.indeterminate = selected > 0 && selected < rows.length;
  all.disabled = displayedBatchBusy;
  $('saveCatalogRows').disabled = !selected || displayedBatchBusy;
  $('saveCatalogRows').textContent = selected ? 'Guardar seleccionados (' + selected + ')' : 'Guardar seleccionados';
}

$('selectCatalogRows').onchange = () => {
  for (const row of rows) row.catalogSelected = $('selectCatalogRows').checked;
  for (const input of $('items').querySelectorAll('.catalog-choice input')) input.checked = $('selectCatalogRows').checked;
  $('catalogBatchStatus').textContent = '';
  updateCatalogSelection();
};

$('saveCatalogRows').onclick = async () => {
  const selected = rows.filter(row => row.catalogSelected);
  if (!selected.length || displayedBatchBusy) return;
  const status = $('catalogBatchStatus');
  status.textContent = '';
  if (totals?.foreignCurrency) {
    status.textContent = 'La factura está en otra moneda. Añade los productos desde Mi catálogo con sus precios en dólares.';
    return;
  }
  const costsVerified = !totals || invoice.reconcile(rows, totals).verified;
  const inputs = selected.map(row => catalogInput(row, costsVerified));
  const currentRows = rows;
  displayedBatchBusy = true;
  updateCatalogSelection();
  try {
    const { saved, skipped } = await window.PorcentoCatalogo.saveNewProducts(inputs);
    if (rows !== currentRows) return;
    for (const index of saved) selected[index].catalogSelected = false;
    $('items').querySelectorAll('.catalog-choice input').forEach((input, index) => {
      input.checked = Boolean(rows[index].catalogSelected);
    });
    const missingCost = saved.filter(index => inputs[index].cost === null).length;
    status.textContent = [
      saved.length === 1 ? '1 producto guardado.' : saved.length + ' productos guardados.',
      skipped.length ? 'Ya estaban guardados: ' + skipped.length + '. Usa Guardar en catálogo para actualizar un producto.' : '',
      missingCost ? 'Costos pendientes: ' + missingCost + '.' : ''
    ].filter(Boolean).join(' ');
  } catch (error) {
    if (rows === currentRows) status.textContent = error.message || 'No se pudieron guardar los productos.';
  } finally {
    displayedBatchBusy = false;
    updateCatalogSelection();
  }
};

function catalogControls(row, index) {
  const section = document.createElement('div');
  section.className = 'save-to-catalog';
  const actions = document.createElement('div');
  actions.className = 'actions';
  const field = document.createElement('div');
  field.className = 'field';
  const label = document.createElement('label');
  label.textContent = 'Precio de venta ($, opcional)';
  const price = document.createElement('input');
  price.inputMode = 'decimal';
  price.placeholder = 'Dejar pendiente';
  price.value = row.catalogSale ?? '';
  price.oninput = () => { row.catalogSale = price.value; };
  price.id = 'catalog-sale-' + index;
  label.htmlFor = price.id;
  field.append(label, price);
  const save = document.createElement('button');
  save.type = 'button';
  save.textContent = 'Guardar en catálogo';
  const status = document.createElement('p');
  status.className = 'status';
  status.setAttribute('role', 'status');
  save.onclick = async () => {
    if (totals?.foreignCurrency) {
      status.textContent = 'Esta factura está en otra moneda. Añade el producto desde Mi catálogo con sus precios en dólares.';
      return;
    }
    const input = catalogInput(row, !totals || invoice.reconcile(rows, totals).verified);
    save.disabled = true;
    price.disabled = true;
    try {
      const catalog = window.PorcentoCatalogo;
      let result = await catalog.save(input, { fromInvoice: true });
      if (result.conflict) {
        if (!confirm('«' + result.conflict.name + '» ya está guardado. ¿Actualizar el producto?')) {
          status.textContent = 'El producto guardado sigue igual.';
          return;
        }
        result = await catalog.save(input, { fromInvoice: true, expected: result.conflict.updated });
      }
      status.textContent = result.saved ? (input.cost === null ? 'Producto guardado. El costo de este renglón está pendiente.' : 'Producto guardado en Mi catálogo.') :
        'El producto cambió. Vuelve a pulsar Guardar en catálogo para revisar la actualización.';
    } catch (error) {
      status.textContent = error.message || 'No se pudo guardar el producto.';
    } finally {
      save.disabled = false;
      price.disabled = false;
    }
  };
  actions.append(field, save);
  section.append(actions, status);
  if (rows.length > 1) {
    const choice = document.createElement('label');
    choice.className = 'catalog-choice';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = Boolean(row.catalogSelected);
    checkbox.onchange = () => {
      row.catalogSelected = checkbox.checked;
      $('catalogBatchStatus').textContent = '';
      updateCatalogSelection();
    };
    choice.append(checkbox, 'Seleccionar para guardar');
    section.append(choice);
  }
  return section;
}

function draw() {
  const items = $('items');
  $('catalogBatchStatus').textContent = '';
  items.replaceChildren();
  rows.forEach((row, index) => {
    const product = document.createElement('article');
    product.className = 'product';
    const heading = document.createElement('div');
    heading.className = 'product-title';
    const fields = document.createElement('div');
    fields.className = 'fields';

    function field(name, label, mode) {
      const wrapper = document.createElement('div');
      wrapper.className = 'field';
      const input = document.createElement('input');
      input.id = name + '-' + index;
      input.type = mode ? 'number' : 'text';
      if (mode) {
        input.inputMode = mode;
        if (mode === 'numeric') input.min = '1';
        input.step = mode === 'decimal' ? '.01' : '1';
      }
      input.value = row[name] ?? '';
      if (name === 'codigo') input.inputMode = 'numeric';
      input.addEventListener('input', () => {
        row[name] = input.value;
        if (name === 'codigo') row.codigoTipo = '';
        recalc();
      });
      const caption = document.createElement('label');
      caption.htmlFor = input.id;
      caption.textContent = label;
      wrapper.append(caption, input);
      if (name === 'codigo') window.PorcentoBarcode.addButton(input);
      return wrapper;
    }

    const remove = document.createElement('button');
    remove.className = 'quiet remove';
    remove.type = 'button';
    remove.textContent = 'Eliminar';
    remove.setAttribute('aria-label', 'Eliminar producto ' + (index + 1));
    remove.onclick = () => { rows.splice(index, 1); draw(); };
    heading.append(field('nombre', 'Producto', ''), remove);
    fields.append(field('costo', 'Costo total ($)', 'decimal'), field('cantidad', 'Unidades', 'numeric'));
    const prices = document.createElement('div');
    prices.className = 'invoice-prices';
    prices.setAttribute('aria-label', 'Precio por margen');
    for (const margin of margins) {
      const cell = document.createElement('div');
      const label = document.createElement('small');
      label.textContent = margin + '%';
      const amount = document.createElement('strong');
      amount.className = 'amount';
      amount.dataset.margin = margin;
      cell.append(label, amount);
      prices.append(cell);
    }
    const codeField = field('codigo', row.codigoTipo === 'interno' ? 'Código del proveedor (puedes poner el UPC)' : 'UPC o código de barras', '');
    product.append(heading, fields, codeField);
    if (row.info) {
      const info = document.createElement('p');
      info.className = 'caption';
      info.textContent = row.info;
      product.append(info);
    }
    if (row.review) {
      const note = document.createElement('p');
      note.className = 'caption invoice-warning';
      note.textContent = row.warning || 'Confirma el costo y las unidades.';
      const confirm = document.createElement('button');
      confirm.type = 'button';
      confirm.textContent = 'Confirmar costo y unidades';
      confirm.onclick = () => {
        if (invoice.moneyCents(row.costo) === null || !Number.isSafeInteger(Number(row.cantidad)) || Number(row.cantidad) < 1) {
          note.textContent = 'Escribe un importe y un número entero de unidades.';
          return;
        }
        row.review = false;
        row.costUnconfirmed = false;
        row.warning = '';
        note.remove();
        confirm.remove();
        recalc();
      };
      product.append(note, confirm);
    }
    const markup = document.createElement('div');
    markup.className = 'invoice-markup';
    const markupLabel = document.createElement('small');
    markupLabel.textContent = 'Precio con costo +50%';
    const markupAmount = document.createElement('strong');
    markupAmount.className = 'amount';
    markupAmount.dataset.markup = '50';
    markup.append(markupLabel, markupAmount);
    const cost = document.createElement('p');
    cost.className = 'invoice-unit-cost caption';
    product.append(cost, prices, markup, catalogControls(row, index));
    items.append(product);
  });
  updateCatalogSelection();
  recalc();
}

function recalc() {
  const check = totals ? invoice.reconcile(rows, totals) : null;
  [...$('items').children].forEach((product, index) => {
    const row = rows[index];
    const pending = row.review || (check && !check.verified);
    const cost = invoice.unitCost(row.costo, row.cantidad);
    product.querySelector('.invoice-unit-cost').textContent = 'Costo por unidad: ' + money(cost ?? NaN) +
      (cost !== null && (pending || row.costUnconfirmed) ? ' · provisional' : '');
    for (const amount of product.querySelectorAll('[data-margin]')) {
      const margin = Number(amount.dataset.margin);
      const price = pending ? null : invoice.suggestedPrice(row.costo, row.cantidad, margin);
      amount.textContent = price === null ? '—' : money(price);
    }
    const markupPrice = pending ? null : invoice.priceWithMarkup(row.costo, row.cantidad);
    product.querySelector('[data-markup]').textContent = markupPrice === null ? '—' : money(markupPrice);
  });
  updateInvoiceSummary(check);
}

const invoice = window.PorcentoFactura;
const margins = [33, 45, 50];
let totals = null;
let documentNotes = [];

function displayInvoice(result, notes = []) {
  rows = result.rows;
  totals = result.totals;
  documentNotes = Array.isArray(notes) ? notes.filter(note => typeof note === 'string').slice(0, 5) : [];
  $('printedTotal').value = totals.total === null ? '' : (totals.total / 100).toFixed(2);
  $('totalInputStatus').textContent = '';
  draw();
  $('status').textContent = rows.length
    ? rows.length + (rows.length === 1 ? ' producto detectado.' : ' productos detectados.')
    : 'No pude identificar productos. Toma una foto más cerca de la tabla o añade los renglones manualmente.';
}

function updateInvoiceSummary(check) {
  const summary = $('invoiceSummary');
  const formatted = cents => money(cents / 100);
  const reviewCount = rows.filter(row => row.review || !Number(row.costo) || !Number(row.cantidad)).length;
  const differenceText = difference => difference > 0 ? 'Faltan ' + formatted(difference) : 'Sobran ' + formatted(-difference);
  summary.dataset.state = check && !check.verified ? 'review' : '';
  $('printedTotalEntry').hidden = !check || check.verified;
  summary.textContent = check ? [
    check.verified ? 'Total cuadrado.' : 'Factura pendiente de revisión.',
    rows.some(row => invoice.moneyCents(row.costo) !== null) ? 'Importes registrados: ' + formatted(check.sum) + '.' : 'Aún no hay importes de productos.',
    totals.subtotal === null ? '' : 'Subtotal impreso: ' + formatted(totals.subtotal) + '.',
    check.computed === check.sum ? '' : 'Con ajustes: ' + formatted(check.computed) + '.',
    totals.total === null ? 'El total impreso no se pudo leer. Puedes escribirlo abajo.' : (totals.manualTotal ? 'Total escrito: ' : 'Total impreso: ') + formatted(totals.total) + '.',
    check.subtotalDifference ? differenceText(check.subtotalDifference) + ' para cuadrar el subtotal.' : '',
    check.difference ? differenceText(check.difference) + ' para cuadrar el total.' : '',
    check.pending ? 'Confirma los importes pendientes.' : '',
    totals.foreignCurrency ? 'Se detectó otra moneda. Los precios de Porcento están en dólares estadounidenses.' : '',
    totals.conflictingTotal ? 'Las dos lecturas dieron totales distintos. Confirma el que aparece en la factura.' : '',
    totals.adjustments.includes(null) ? 'Hay un ajuste impreso por confirmar.' : '',
    totals.partial ? 'La imagen o el documento está incompleto.' : '',
    reviewCount ? reviewCount + (reviewCount === 1 ? ' renglón por revisar.' : ' renglones por revisar.') : '',
    ...documentNotes
  ].filter(Boolean).join(' ') : '';
  $('export').disabled = !rows.length || Boolean(check && !check.verified);
}

$('printedTotalEntry').onsubmit = event => {
  event.preventDefault();
  const entered = invoice.moneyCents($('printedTotal').value);
  if (!totals || entered === null) {
    $('totalInputStatus').textContent = 'Escribe el total tal como aparece en la factura.';
    return;
  }
  totals.total = entered;
  totals.manualTotal = true;
  totals.conflictingTotal = false;
  $('totalInputStatus').textContent = '';
  recalc();
};

const scripts = new Map();
function loadScript(url) {
  if (!scripts.has(url)) {
    const pending = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = url;
      script.onload = resolve;
      script.onerror = () => reject(Error('No se pudo cargar el lector.'));
      document.head.append(script);
    }).catch(error => { scripts.delete(url); throw error; });
    scripts.set(url, pending);
  }
  return scripts.get(url);
}

const pdfBase = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.624/legacy/build/';
let pdfLibrary;
const isPdf = file => file.type === 'application/pdf' || /\.pdf$/i.test(file.name);

async function openPdf(file) {
  pdfLibrary ??= import(pdfBase + 'pdf.min.mjs').catch(error => {
    pdfLibrary = null;
    throw error;
  });
  const pdf = await pdfLibrary;
  pdf.GlobalWorkerOptions.workerSrc = pdfBase + 'pdf.worker.min.mjs';
  return pdf.getDocument({ data: await file.arrayBuffer(), isEvalSupported: false }).promise;
}

async function pdfPageCanvas(page) {
  const canvas = document.createElement('canvas');
  const natural = page.getViewport({ scale: 1 });
  const viewport = page.getViewport({ scale: Math.min(3, 2800 / Math.max(natural.width, natural.height)) });
  canvas.width = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  try {
    const text = await page.getTextContent();
    canvas.invoiceWords = text.items.flatMap(item => {
      if (!item.str?.trim() || !item.transform || item.width <= 0 || item.height <= 0) return [];
      const [x, baseline] = viewport.convertToViewportPoint(item.transform[4], item.transform[5]);
      const height = item.height * viewport.scale;
      return [...item.str.matchAll(/\S+/g)].map(term => ({
        text: term[0], x: x + item.width * viewport.scale * term.index / item.str.length,
        y: baseline - height, width: item.width * viewport.scale * term[0].length / item.str.length, height
      }));
    });
  } catch { /* A scanned page can still be rendered for OCR. */ }
  // Render lazily so a PDF with readable text needs neither rendering nor OCR.
  canvas.renderPdf = async () => {
    await page.render({ canvas, viewport }).promise;
    delete canvas.renderPdf;
  };
  return canvas;
}

async function readCanvas(file) {
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d');
  const image = new Image();
  const url = URL.createObjectURL(file);
  try {
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(Error('Usa una foto legible en JPEG o PNG.'));
      image.src = url;
    });
    const scale = Math.min(1, 3000 / Math.max(image.naturalWidth, image.naturalHeight));
    canvas.width = Math.round(image.naturalWidth * scale);
    canvas.height = Math.round(image.naturalHeight * scale);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function ocrRegion(source, top, bottom, start = .09, end = .91, magnify = 2, rotation = 0) {
  const crop = document.createElement('canvas');
  const left = Math.round(source.width * start);
  const width = Math.round(source.width * end) - left;
  const height = Math.round(source.height * (bottom - top));
  const scale = Math.min(magnify, 2150 / width);
  const border = 18;
  crop.width = Math.round(width * scale) + border * 2;
  crop.height = Math.round(height * scale) + border * 2;
  const context = crop.getContext('2d', { willReadFrequently: true });
  context.fillStyle = '#fff';
  context.fillRect(0, 0, crop.width, crop.height);
  context.imageSmoothingQuality = 'high';
  if (rotation) {
    context.save();
    context.translate(border - left * scale, border - Math.round(top * source.height) * scale);
    context.scale(scale, scale);
    context.translate(source.width / 2, source.height / 2);
    context.rotate(rotation * Math.PI / 180);
    context.drawImage(source, -source.width / 2, -source.height / 2);
    context.restore();
  } else {
    context.drawImage(source, left, Math.round(top * source.height), width, height,
      border, border, crop.width - border * 2, crop.height - border * 2);
  }

  const image = context.getImageData(0, 0, crop.width, crop.height);
  const pixels = image.data;
  const histogram = new Uint32Array(256);
  for (let i = 0; i < pixels.length; i += 4) {
    const gray = (pixels[i] * 299 + pixels[i + 1] * 587 + pixels[i + 2] * 114) / 1000 | 0;
    pixels[i] = gray;
    histogram[gray]++;
  }
  let low = 0, high = 255;
  let leftCount = pixels.length / 4 * .003, rightCount = pixels.length / 4 * .003;
  while (low < 230 && (leftCount -= histogram[low]) > 0) low++;
  while (high > low + 24 && (rightCount -= histogram[high]) > 0) high--;
  const gain = 255 / Math.max(24, high - low);
  for (let i = 0; i < pixels.length; i += 4) {
    const gray = (pixels[i] - low) * gain;
    pixels[i] = pixels[i + 1] = pixels[i + 2] = gray;
  }
  context.putImageData(image, 0, 0);
  return crop;
}

function readingIsVerified(result) {
  return invoice.reconcile(result.rows, result.totals).verified;
}

const formatHints = {
  dairy: 'Incluye ITEM, DESCRIPTION, PCS y AMOUNT. Fotografía la línea Total This Invoice si quedó fuera.',
  aaa: 'Incluye el número de artículo, su descripción y el renglón con la cantidad y el importe de cada producto.',
  taino: 'Incluye desde la columna UPC hasta Amount. Fotografía Invoice Total si quedó fuera.',
  rosas: 'Incluye las columnas Producto, Cant, Precio y Total. Fotografía Total Neto si quedó fuera.',
  azmetro: 'Incluye la tabla desde Cases hasta Total y el recuadro con Fuel Charges y Sub Total.'
};
const defaultFormatHint = $('formatHint').textContent;
$('invoiceFormat').onchange = () => {
  $('formatHint').textContent = formatHints[$('invoiceFormat').value] ?? defaultFormatHint;
};

let selectedFile = null;
let selectedTotalPhoto = null;

function setTotalPhoto(file) {
  selectedTotalPhoto = file;
  $('removeTotalPhoto').hidden = !file;
  $('totalPhotoStatus').textContent = file ? 'Foto del total lista para el lector básico.' : '';
}

$('takeTotalPhoto').onclick = () => {
  if (!selectedFile) {
    $('totalPhotoStatus').textContent = 'Toma primero la foto de la tabla de productos.';
    return;
  }
  $('totalPhotoFile').click();
};
$('totalPhotoFile').onchange = () => {
  const input = $('totalPhotoFile');
  if (input.files[0]) setTotalPhoto(input.files[0]);
  input.value = '';
};
$('removeTotalPhoto').onclick = () => setTotalPhoto(null);

$('takePhoto').onclick = () => $('cameraFile').click();
$('chooseFile').onclick = () => $('file').click();
for (const id of ['cameraFile', 'file']) {
  const input = $(id);
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    selectedFile = file;
    setTotalPhoto(null);
    input.value = '';
    rows = [];
    totals = null;
    documentNotes = [];
    $('raw').value = '';
    draw();
    $('preview').hidden = true;
    $('preview').removeAttribute('src');
    $('status').textContent = '';
    $('selectedInvoice').textContent = isPdf(file) ? 'PDF listo para leer.' : 'Foto lista para leer.';
  };
}

async function withInvoice(read) {
  if (!selectedFile) {
    $('status').textContent = 'Toma una foto de la factura o elige una ya guardada.';
    return;
  }
  const controls = ['takePhoto', 'chooseFile', 'takeTotalPhoto', 'removeTotalPhoto', 'invoiceFormat', 'read', 'parse'].map($);
  controls.forEach(button => { button.disabled = true; });
  try {
    $('status').textContent = 'Preparando factura…';
    await read(selectedFile);
  } catch (error) {
    $('status').textContent = error.message || 'No se pudo leer la factura.';
  } finally {
    controls.forEach(button => { button.disabled = false; });
  }
}

function preview(canvas) {
  const image = canvas.toDataURL('image/jpeg', .87);
  $('preview').src = image;
  $('preview').hidden = false;
  return image;
}

async function scanAzMetro(canvas, worker, modes, initial, separateTotals) {
  const words = invoice.tsvWords(initial.tsv);
  const label = words.find(word => /^description$/i.test(word.text));
  const end = words.find(word => /^charges$/i.test(word.text) && word.y > canvas.height * .45);
  const tableTop = label ? Math.max(0, label.y / canvas.height - .032) : .21;
  const tableBottom = Math.min(1, tableTop + .163);
  const footerTop = end ? Math.max(.30, end.y / canvas.height - .11) : .57;
  const parse = text => invoice.parseText(text, { format: 'azmetro' });
  let reading = parse(initial.text);
  const initialTotals = reading.totals;
  let text = '';
  let footer = separateTotals;
  const read = async (image, psm) => {
    await worker.setParameters({ tessedit_pageseg_mode: psm, preserve_interword_spaces: '1' });
    return (await worker.recognize(image, {}, { text: true, tsv: true })).data;
  };

  const footerRegions = [[.64, .95, .215, 4], [.59, .98, .28, 0], [.59, 1, .28, -4]];
  for (const [left, right, span, rotation] of footerRegions) {
    if (footer?.total != null) break;
    const scan = await read(ocrRegion(canvas, footerTop, Math.min(1, footerTop + span), left, right, 2, rotation), modes.SINGLE_BLOCK);
    const candidate = parse(scan.text).totals;
    if (candidate.total !== null) {
      footer = candidate;
      text = scan.text;
    }
  }

  let bestText = initial.text;
  const tableRegions = [
    [tableTop, tableBottom, .08, .924, 2, 4],
    [tableTop, tableBottom, .08, .94, 2, 2],
    [tableTop, Math.min(1, tableBottom + .08), 0, 1, 2, 0],
    [0, Math.min(1, tableBottom + .14), 0, 1, 2, -4],
    [0, 1, 0, 1, 2, 0]
  ];
  for (const region of tableRegions) {
    const image = ocrRegion(canvas, ...region);
    const sparse = await read(image, modes.SPARSE_TEXT);
    const block = await read(image, modes.SINGLE_BLOCK);
    const lines = block.text + '\n' + text;
    const parsed = parse(lines);
    const recovered = invoice.readAzTable(invoice.tsvWords(sparse.tsv), invoice.tsvWords(block.tsv));
    const totals = footer?.total != null ? { ...footer } : { ...reading.totals, total: reading.totals.total ?? parsed.totals.total };
    if (footer?.total != null && initialTotals.total !== null && initialTotals.total !== footer.total) totals.conflictingTotal = true;
    if (footer?.total != null && !footer.adjustments.length && initialTotals.adjustments.length) totals.adjustments = initialTotals.adjustments;
    totals.foreignCurrency ||= reading.totals.foreignCurrency || parsed.totals.foreignCurrency;
    const candidate = invoice.chooseTableReading({ rows: parsed.rows, totals }, { rows: recovered, totals });
    if (invoice.preferReading(reading, candidate)) {
      reading = candidate;
      bestText = lines;
    }
    if (readingIsVerified(reading)) break;
  }
  return { reading, text: bestText, notes: [] };
}

async function scanPage(canvas, getWorker, totalPhoto) {
  const selectedFormat = $('invoiceFormat').value;
  const embedded = invoice.readEmbeddedInvoice(canvas.invoiceWords, selectedFormat);
  if (embedded && !totalPhoto && (readingIsVerified(embedded.reading) || (canvas.pdfMultiple && embedded.reading.rows.length > 0))) {
    return { ...embedded, notes: [] };
  }
  if (canvas.renderPdf) await canvas.renderPdf();
  if ($('preview').hidden) preview(canvas);
  $('status').textContent = 'Leyendo los productos…';
  const worker = await getWorker();
  const Tesseract = window.Tesseract;
  const setMode = mode => worker.setParameters({ tessedit_pageseg_mode: mode, preserve_interword_spaces: '1' });
  const recognize = async image => (await worker.recognize(image)).data.text;
  const notes = [];
  let result = null;
  let text = '';
  let separateTotals = null;
  await setMode(Tesseract.PSM.SINGLE_BLOCK);
  const firstScan = (await worker.recognize(canvas, {}, { text: true, tsv: true })).data;
  const firstText = firstScan.text;
  let format = selectedFormat || invoice.detectFormat(firstText);
  const parse = input => invoice.parseText(input, { format: format || undefined });
  const firstTotal = parse(firstText).totals.total;
  const consider = (input, footer = separateTotals, words = []) => {
    let next = parse(input);
    if (words.length) {
      const table = invoice.readEmbeddedInvoice(words, format);
      const combined = table.reading;
      combined.totals.subtotal ??= next.totals.subtotal;
      combined.totals.total ??= next.totals.total;
      combined.totals.foreignCurrency ||= next.totals.foreignCurrency;
      if (!combined.totals.adjustments.length) combined.totals.adjustments = next.totals.adjustments;
      next = combined.rows.length ? combined : next;
      if (next === combined) input = table.text;
    }
    const tableTotal = next.totals.total ?? firstTotal;
    next.totals.total = tableTotal;
    if (footer) {
      next.totals.foreignCurrency ||= footer.foreignCurrency;
      if (footer.total !== null && tableTotal !== null && tableTotal !== footer.total) {
        next.totals.conflictingTotal = true;
      }
      next.totals.total = footer.total ?? next.totals.total;
      next.totals.subtotal ??= footer.subtotal;
      if (!next.totals.adjustments.length) next.totals.adjustments = footer.adjustments;
    }
    if (!result || invoice.preferReading(result, next)) {
      result = next;
      text = input;
    }
  };

  if (totalPhoto) {
    $('status').textContent = 'Leyendo la foto del total…';
    try {
      const footerCanvas = await readCanvas(totalPhoto);
      await setMode(Tesseract.PSM.SPARSE_TEXT);
      separateTotals = parse(await recognize(ocrRegion(footerCanvas, 0, 1, 0, 1, 2))).totals;
      if (separateTotals.total === null) {
        await setMode(Tesseract.PSM.SINGLE_BLOCK);
        separateTotals = parse(await recognize(footerCanvas)).totals;
      }
      if (separateTotals.total === null) notes.push('La foto del total no mostró un importe con la etiqueta Total. Puedes escribirlo abajo.');
    } catch {
      notes.push('No se pudo leer la segunda foto. Puedes escribir el total abajo.');
    }
  }
  if (format === 'azmetro' && !canvas.pdfMultiple) {
    $('status').textContent = 'Leyendo las columnas y los descuentos de AZ Metro…';
    const az = await scanAzMetro(canvas, worker, Tesseract.PSM, firstScan, separateTotals);
    return { ...az, notes };
  }
  consider(firstText);
  if (!readingIsVerified(result)) consider(firstText, separateTotals, invoice.tsvWords(firstScan.tsv));
  if (embedded) consider(embedded.text, separateTotals, canvas.invoiceWords);
  if (!readingIsVerified(result)) {
    $('status').textContent = 'Ampliando la tabla y revisando los importes…';
    try {
      await setMode(Tesseract.PSM.SINGLE_BLOCK);
      const focused = (await worker.recognize(ocrRegion(canvas, 0, 1, 0, 1, 2), {}, { text: true, tsv: true })).data;
      consider(focused.text);
      if (!readingIsVerified(result)) consider(focused.text, separateTotals, invoice.tsvWords(focused.tsv));
      if (!readingIsVerified(result) && !totalPhoto) {
        const table = await recognize(ocrRegion(canvas, .07, .61));
        format ||= invoice.detectFormat(table);
        const footerRegions = { rosas: [.31, .49, .45, 1], taino: [.73, .98, .45, 1], aaa: [.70, 1, .28, .82] };
        const footerRegion = footerRegions[format] ?? [.53, .97, .09, 1];
        let footer = parse(await recognize(ocrRegion(canvas, ...footerRegion))).totals;
        if (format === 'dairy' && footer.total === null) {
          await setMode(Tesseract.PSM.SPARSE_TEXT);
          const focusedTotal = parse(await recognize(ocrRegion(canvas, .44, .76, .49, 1, 3))).totals;
          if (focusedTotal.total !== null) footer = focusedTotal;
          await setMode(Tesseract.PSM.SINGLE_BLOCK);
        }
        consider(firstText, footer);
        consider(table, footer);
        if (format && !readingIsVerified(result)) {
          $('status').textContent = 'Ajustando la lectura al formato de la factura…';
          const regions = {
            dairy: [.04, .45, .11, 1],
            aaa: [.12, .88, .29, .75],
            taino: [.28, .67, 0, 1],
            rosas: [.23, .40, 0, 1]
          };
          const detail = await recognize(ocrRegion(canvas, ...regions[format]));
          consider(detail, footer);
        }
        if (!readingIsVerified(result) && format && footer.total === null && footerRegions[format]) {
          await setMode(Tesseract.PSM.SPARSE_TEXT);
          const alternate = parse(await recognize(ocrRegion(canvas, .40, 1, 0, 1))).totals;
          if (alternate.total !== null) {
            const checked = { rows: result.rows, totals: { ...result.totals, total: alternate.total } };
            if (result.totals.total === null) result = checked;
            else if (result.totals.total !== null && result.totals.total !== alternate.total) result.totals.conflictingTotal = true;
          }
        }
      }
    } catch {
      notes.push('La relectura se interrumpió. Revisa los renglones recuperados.');
    }
  }
  return { text, reading: result, notes };
}

function combinePdfPages(pages) {
  const readings = pages.map(page => page.reading);
  const products = readings.flatMap(reading => reading.rows);
  const final = readings.at(-1).totals;
  const firstTotal = readings.find(reading => reading.totals.total !== null)?.totals.total ?? null;
  const printedTotals = new Set(readings.map(reading => reading.totals.total).filter(total => total !== null));
  return {
    rows: products,
    totals: {
      ...final,
      total: final.total ?? firstTotal,
      partial: readings.some(reading => reading.totals.partial || (!reading.rows.length && reading.totals.total === null)),
      foreignCurrency: readings.some(reading => reading.totals.foreignCurrency),
      conflictingTotal: printedTotals.size > 1 || readings.some(reading => reading.totals.conflictingTotal)
    }
  };
}

$('read').onclick = () => withInvoice(async file => {
  let worker;
  const getWorker = async () => {
    if (!worker) {
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
      worker = await window.Tesseract.createWorker('eng+spa');
    }
    return worker;
  };
  let documentPdf;
  try {
    const pages = [];
    if (isPdf(file)) {
      documentPdf = await openPdf(file);
      for (let number = 1; number <= documentPdf.numPages; number++) {
        $('status').textContent = 'Leyendo página ' + number + ' de ' + documentPdf.numPages + '…';
        const page = await documentPdf.getPage(number);
        const canvas = await pdfPageCanvas(page);
        canvas.pdfMultiple = documentPdf.numPages > 1;
        pages.push(await scanPage(canvas, getWorker, number === documentPdf.numPages ? selectedTotalPhoto : null));
        page.cleanup();
      }
    } else {
      pages.push(await scanPage(await readCanvas(file), getWorker, selectedTotalPhoto));
    }
    const result = pages.length === 1 ? pages[0].reading : combinePdfPages(pages);
    $('raw').value = pages.map(page => page.text).join('\n');
    displayInvoice(result, pages.flatMap(page => page.notes));
    if (!readingIsVerified(result)) $('basicOptions').open = true;
  } finally {
    try {
      if (worker) await worker.terminate();
    } finally {
      if (documentPdf) await documentPdf.destroy();
    }
  }
});
$('parse').onclick = () => {
  const result = invoice.parseText($('raw').value, { format: $('invoiceFormat').value || undefined });
  if (totals) {
    result.totals.partial ||= totals.partial;
    result.totals.foreignCurrency ||= totals.foreignCurrency;
    result.totals.conflictingTotal ||= totals.conflictingTotal;
    if (totals.manualTotal || result.totals.total === null) {
      result.totals.total = totals.total;
      result.totals.manualTotal = totals.manualTotal;
    }
    result.totals.subtotal ??= totals.subtotal;
    if (!result.totals.adjustments.length) result.totals.adjustments = totals.adjustments;
  }
  displayInvoice(result);
};
$('add').onclick = () => {
  rows.push({ nombre: '', costo: '', cantidad: '' });
  draw();
  $('nombre-' + (rows.length - 1)).focus();
};
$('export').onclick = () => {
  if ($('export').disabled) return;
  const quote = value => {
    let text = String(value ?? '');
    if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g, '""') + '"';
  };
  const lines = [['Producto', 'Costo total', 'Unidades', 'Costo por unidad', '33%', '45%', '50%', 'Por revisar', 'Precio con costo +50%']];
  for (const row of rows) {
    const prices = margins.map(margin => row.review ? null : invoice.suggestedPrice(row.costo, row.cantidad, margin));
    const markup = row.review ? null : invoice.priceWithMarkup(row.costo, row.cantidad);
    const values = [row.nombre, row.costo, row.cantidad,
      row.review ? '' : invoice.unitCost(row.costo, row.cantidad), ...prices,
      row.warning || (row.review ? 'Revisar' : ''), markup === null ? '' : markup.toFixed(2)];
    lines.push(values);
  }
  const csv = lines.map(line => line.map(quote).join(',')).join('\r\n');
  const download = document.createElement('a');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  download.href = url;
  download.download = 'porcento-factura.csv';
  download.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
updateInvoiceSummary();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
