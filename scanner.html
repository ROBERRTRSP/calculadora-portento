<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./porcento.css">
  <title>Leer factura · Porcento</title>
  <style>
    #file { font-size: 13px; padding: 6px; }
    #file::file-selector-button { background: var(--surface); color: var(--accent); font: inherit; font-weight: 650; border: 0; border-radius: 8px; min-height: 32px; padding: 5px 8px; margin-right: 7px; }
    #preview { display: block; max-width: 100%; max-height: 220px; margin: 10px auto 0; border-radius: 10px; }
    #status, .invoice-actions { margin-top: 8px; }
    .invoice-disclosure { margin-top: 8px; }
    .invoice-disclosure .caption { display: block; margin-top: 8px; }
    #items { margin-top: 8px; }
    .product { padding-top: 7px; border-top: 1px solid var(--hairline); }
    .product + .product { margin-top: 8px; }
    .product-title { display: flex; align-items: end; gap: 8px; margin-bottom: 7px; }
    .product-title .field { flex: 1; }
    .remove { flex: none; color: var(--negative); }
    .invoice-prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
    .invoice-prices > div { background: var(--tint); border-radius: 10px; text-align: center; padding: 5px; min-width: 0; }
    .invoice-prices .amount { display: block; color: var(--accent); }
    #raw { min-height: 100px; resize: vertical; }
  </style>
</head>
<body>
  <main class="app">
    <a class="back" href="./index.html">‹ Porcento</a>
    <header class="page-header"><h1>Leer factura</h1></header>
    <section class="card" aria-label="Seleccionar factura">
      <label for="file">Foto o PDF de la factura</label>
      <input id="file" type="file" accept="image/*,application/pdf" capture="environment">
      <div class="actions invoice-actions">
        <button class="primary" id="read" type="button">Leer factura</button>
        <button id="ai" type="button">Leer con IA</button>
      </div>
      <p id="status" class="status" role="status"></p>
      <img id="preview" hidden alt="Vista previa de la factura">
      <details class="invoice-disclosure" id="connection">
        <summary>Configurar lectura con IA</summary>
        <div class="details-body">
          <label for="endpoint">Dirección del servidor</label>
          <input id="endpoint" type="url" placeholder="https://tu-servidor.workers.dev">
          <button id="saveEndpoint" type="button">Guardar dirección</button>
          <small class="caption">Al usar IA, se envía la imagen al servidor configurado y al proveedor de IA.</small>
        </div>
      </details>
    </section>
    <section class="card" aria-labelledby="products-heading">
      <h2 id="products-heading">Productos</h2>
      <div id="items"></div>
      <div class="actions invoice-actions">
        <button id="add" type="button">Añadir producto</button>
        <button id="export" type="button">Descargar CSV</button>
      </div>
    </section>
    <details class="card">
      <summary>Revisar texto leído</summary>
      <div class="details-body">
        <label for="raw">Texto de la factura</label>
        <textarea id="raw" placeholder="También puedes pegar texto aquí."></textarea>
        <button id="parse" type="button">Analizar texto</button>
      </div>
    </details>
  </main>
  <script>
const $=id=>document.getElementById(id), money=n=>Number.isFinite(n)?'$'+n.toFixed(2):'—';let rows=[];$('endpoint').value=localStorage.getItem('porcento_ai_endpoint')||'';$('saveEndpoint').onclick=()=>{let v=$('endpoint').value.trim().replace(/\/$/,'');if(!/^https:\/\//.test(v)){$('status').textContent='La dirección debe comenzar con https://';return}localStorage.setItem('porcento_ai_endpoint',v);$('status').textContent='Dirección guardada.'};
function draw() {
  const items = $('items');
  items.replaceChildren();
  rows.forEach((row, index) => {
    const product = document.createElement('article');
    product.className = 'product';
    const heading = document.createElement('div');
    heading.className = 'product-title';
    const fields = document.createElement('div');
    fields.className = 'fields';

    function field(name, label, mode) {
      const wrapper = document.createElement('div');
      wrapper.className = 'field';
      const input = document.createElement('input');
      input.id = name + '-' + index;
      input.type = mode ? 'number' : 'text';
      if (mode) {
        input.inputMode = mode;
        input.min = mode === 'decimal' ? '0' : '1';
        input.step = mode === 'decimal' ? '.01' : '1';
      }
      input.value = row[name];
      input.addEventListener('input', () => {
        row[name] = input.value;
        recalc();
      });
      const caption = document.createElement('label');
      caption.htmlFor = input.id;
      caption.textContent = label;
      wrapper.append(caption, input);
      return wrapper;
    }

    const remove = document.createElement('button');
    remove.className = 'quiet remove';
    remove.type = 'button';
    remove.textContent = 'Eliminar';
    remove.setAttribute('aria-label', 'Eliminar producto ' + (index + 1));
    remove.onclick = () => { rows.splice(index, 1); draw(); };
    heading.append(field('nombre', 'Producto', ''), remove);
    fields.append(field('costo', 'Costo total ($)', 'decimal'), field('cantidad', 'Unidades', 'numeric'));
    const prices = document.createElement('div');
    prices.className = 'invoice-prices';
    prices.setAttribute('aria-label', 'Precio por margen');
    for (const margin of [33, 45, 50]) {
      const cell = document.createElement('div');
      const label = document.createElement('small');
      label.textContent = margin + '%';
      const amount = document.createElement('strong');
      amount.className = 'amount';
      amount.dataset.margin = margin;
      cell.append(label, amount);
      prices.append(cell);
    }
    product.append(heading, fields, prices);
    items.append(product);
  });
  recalc();
}

function recalc() {
  [...$('items').children].forEach((product, index) => {
    const cost = Number(rows[index].costo), quantity = Number(rows[index].cantidad);
    for (const amount of product.querySelectorAll('[data-margin]')) {
      const margin = Number(amount.dataset.margin);
      const price = cost > 0 && quantity > 0
        ? Math.ceil((cost / quantity / (1 - margin / 100) - 1e-9) * 100) / 100
        : NaN;
      amount.textContent = money(price);
    }
  });
}

function parse(text){let lines=text.split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean),found=[];for(let line of lines){if(/\b(?:total|subtotal|tax|invoice|factura|balance|amount due|fecha|date|page|página|teléfono|phone|cliente|vendor|vendedor|dirección|address|crédito|neto|nit)\b/i.test(line))continue;let pack=line.match(/\b(\d{1,3})\s*\/\s*(?:\d{1,3}(?:[.,]\d+)?\s*(?:oz|ml|gr|g|l)?)\b/i)||line.match(/\b(?:caja|case|pack|pk|cs|ct|unidades|units|unid|und)\s*[:x]?\s*(\d{1,3})\b/i)||line.match(/\b(\d{1,3})\s*(?:un|und|unid|units|ct|pk|pcs)\b/i);let priceTokens=[...line.matchAll(/\$\s*(\d{1,5}[.,]\d{2})\b/g)];if(!priceTokens.length){let tail=line.match(/(?:^|\s)(\d{1,5}[.,]\d{2})\s*$/);if(tail&&pack)priceTokens=[{0:tail[0],1:tail[1],index:line.lastIndexOf(tail[1])}]}if(!priceTokens.length)continue;let last=priceTokens[priceTokens.length-1],cost=Number(last[1].replace(',','.'));let name=line.slice(0,last.index).replace(/\b\d+\s*(?:ca|caja|un|und)\b/gi,'').replace(/\s+/g,' ').trim();if(!/[a-záéíóúñ]{3}/i.test(name)||cost<=0||cost>5000||/^(?:no\.|nro\.|ref|cod|#)/i.test(name))continue;let qty=pack?Number(pack[1]):0;if(qty>200)qty=0;found.push({nombre:name.slice(0,100),costo:cost,cantidad:qty||'',revision:!qty})}rows=found;draw();$('status').textContent=found.length?found.length+' posibles productos. Confirma costo y unidades en cada fila; no se calcularán precios sin unidades.':'No se detectaron filas completas con seguridad. Esta factura tiene columnas separadas: usa + Añadir producto para introducir los datos, o toma una foto más recta y cercana.'}
async function imageData(file){let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(file.type==='application/pdf'){if(!window.pdfjsLib)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let page=await doc.getPage(1),vp=page.getViewport({scale:2});canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:ctx,viewport:vp}).promise}else{let img=new Image(),url=URL.createObjectURL(file);await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});let scale=Math.min(1,2400/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url)}return canvas.toDataURL('image/jpeg',.83)}
$('ai').onclick=async()=>{let file=$('file').files[0],endpoint=$('endpoint').value.trim().replace(/\/$/,'');if(!file){$('status').textContent='Selecciona una foto o PDF primero.';return}if(!/^https:\/\//.test(endpoint)){$('connection').open=true;$('endpoint').focus();$('status').textContent='Escribe la dirección del servidor de IA.';return}let btn=$('ai');btn.disabled=true;try{$('status').textContent='Preparando factura…';let image=await imageData(file);$('preview').src=image;$('preview').hidden=false;$('status').textContent='La IA está identificando las columnas y verificando precios…';let response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image})});let data=await response.json();if(!response.ok)throw Error(data.error||'Error de lectura');rows=data.productos.map(p=>{let q=Number(p.cantidad_comprada),pack=Number(p.unidades_por_empaque),total=Number(p.total_linea),per=Number(p.costo_unitario),price=Number(p.precio_empaque),qty=q>0&&pack>0?q*pack:0;let cost=qty>0&&total>0?total:qty>0&&per>0?per*qty:q>0&&price>0?price*q:0;return {nombre:p.nombre||'Producto sin nombre',costo:cost?cost.toFixed(2):'',cantidad:qty||'',revision:p.confianza!=='alta'||!cost||!qty}});draw();$('status').textContent=rows.length+' productos extraídos. '+rows.filter(r=>r.revision).length+' requieren revisión. Comprueba los precios antes de usarlos.';if(!rows.length)throw Error('No se detectaron productos')}catch(e){$('status').textContent='No se completó la lectura con IA: '+e.message}finally{btn.disabled=false}};
function loadScript(url){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar el lector. Comprueba tu conexión.'));document.head.append(s)})}
$('read').onclick=async()=>{let file=$('file').files[0];if(!file){$('status').textContent='Primero selecciona una foto o PDF.';return}let b=$('read');b.disabled=true;try{$('status').textContent='Preparando lector…';let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(file.type==='application/pdf'){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let page=await doc.getPage(1),vp=page.getViewport({scale:2});canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:ctx,viewport:vp}).promise}else{let img=new Image(),url=URL.createObjectURL(file);await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});let scale=Math.min(1,2200/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url)}$('preview').src=canvas.toDataURL('image/jpeg',.85);$('preview').hidden=false;await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');$('status').textContent='Leyendo texto… puede tardar unos segundos';let worker=await Tesseract.createWorker('eng+spa');try{let result=await worker.recognize(canvas);$('raw').value=result.data.text;parse(result.data.text)}finally{await worker.terminate()}}catch(e){$('status').textContent='No se pudo leer: '+e.message+'. Prueba con una foto más clara o pega el texto manualmente.'}finally{b.disabled=false}};
$('parse').onclick=()=>parse($('raw').value);$('add').onclick=()=>{rows.push({nombre:'',costo:'',cantidad:''});draw()};$('export').onclick=()=>{let csv=[['Producto','Costo caja','Unidades','Costo unidad','33%','45%','50%'],...rows.map(r=>{let c=+r.costo,q=+r.cantidad;return[r.nombre,c,q,q?c/q:'',...[33,45,50].map(m=>q?Math.ceil(c/q/(1-m/100)*100)/100:'') ]})].map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='porcento-factura.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
  </script>
</body>
</html>
