<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Porcento">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./porcento.css?v=27">
  <title>Mi catálogo · Porcento</title>
  <style>
    #catalogEditor { margin-top: 10px; }
    #catalogEditor .actions { margin-top: 10px; }
    #catalogList { list-style: none; margin: 12px 0 0; padding: 0; }
    #catalogList .row { align-items: start; }
    #catalogList .row > div { min-width: 0; }
    #catalogList h3 { overflow-wrap: anywhere; margin-bottom: 3px; }
    #catalogList .row button { flex: none; }
    .catalog-item { flex: 1; display: flex; gap: 9px; align-items: center; }
    .catalog-item > div { min-width: 0; }
    .catalog-thumbnail, .catalog-photo-placeholder { flex: none; width: 58px; height: 58px; border-radius: 9px; background: var(--field); }
    .catalog-thumbnail { object-fit: contain; }
    .catalog-photo-placeholder { display: grid; place-items: center; color: var(--muted); }
    #productPhotoField { margin: 12px 0 0; padding: 0; border: 0; min-width: 0; }
    #productPhotoField legend { font-size: 13px; font-weight: 650; padding: 0; }
    #productPhotoPreview { display: block; width: min(100%, 210px); max-height: 180px; object-fit: contain; background: var(--field); border-radius: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <main class="app">
    <a class="back" href="./index.html">‹ Porcento</a>
    <header class="page-header"><h1>Mi catálogo</h1></header>
    <section class="card" aria-label="Gestionar productos">
      <p class="caption">Los productos se guardan en este navegador. Exporta una copia para guardarlos en Archivos.</p>
      <p id="catalogStatus" class="status" role="status"></p>
      <div class="actions field">
        <button id="newProduct" class="primary" type="button">Añadir producto</button>
        <a class="button" href="./scanner.html">Leer factura</a>
        <button id="exportCatalog" type="button">Exportar copia</button>
        <button id="importCatalog" type="button">Restaurar copia</button>
        <input id="importCatalogFile" type="file" accept="application/json,.json" hidden>
      </div>
      <form id="catalogEditor" hidden aria-labelledby="editorTitle">
        <h2 id="editorTitle">Añadir producto</h2>
        <div class="field">
          <label for="productName">Producto</label>
          <input id="productName" required maxlength="180" autocomplete="off">
        </div>
        <div class="field">
          <label for="productCode">UPC / EAN <small>(opcional)</small></label>
          <input id="productCode" inputmode="numeric" autocomplete="off">
        </div>
        <fieldset id="productPhotoField">
          <legend>Foto del producto <small>(opcional)</small></legend>
          <img id="productPhotoPreview" alt="Vista previa de la foto del producto" hidden>
          <div class="actions">
            <button id="takeProductPhoto" type="button">Tomar foto</button>
            <button id="chooseProductPhoto" type="button">Elegir foto</button>
          </div>
          <input id="productCameraFile" type="file" accept="image/*" capture="environment" hidden>
          <input id="productPhotoFile" type="file" accept="image/*" hidden>
          <p id="photoStatus" class="status" role="status"></p>
        </fieldset>
        <div class="fields field">
          <div class="field">
            <label for="productCost">Precio total de compra ($) <small>(opcional)</small></label>
            <input id="productCost" inputmode="decimal" placeholder="0.00" autocomplete="off">
          </div>
          <div class="field">
            <label for="productUnits">Unidades compradas <small>(opcional)</small></label>
            <input id="productUnits" type="number" min="1" step="1" inputmode="numeric" placeholder="Ej. 25">
          </div>
        </div>
        <p id="productUnitCost" class="status" aria-live="polite"></p>
        <div class="field">
          <label for="productSale">Precio de venta por unidad ($) <small>(opcional)</small></label>
          <input id="productSale" inputmode="decimal" placeholder="0.00" autocomplete="off">
        </div>
        <div class="actions">
          <button id="saveProduct" class="primary" type="submit">Guardar producto</button>
          <button id="cancelProduct" type="button">Cancelar</button>
          <button id="deleteProduct" type="button" class="quiet negative" hidden>Eliminar</button>
        </div>
        <p id="editorStatus" class="status" role="status"></p>
      </form>
    </section>
    <section class="card" aria-label="Productos guardados">
      <label for="catalogSearch">Buscar productos guardados</label>
      <input id="catalogSearch" type="search" placeholder="Nombre o código">
      <ul id="catalogList"></ul>
      <p id="catalogEmpty" class="status" role="status"></p>
    </section>
  </main>
  <script src="./factura.js?v=27"></script>
  <script src="./catalogo.js?v=27"></script>
  <script src="./barcode.js?v=27"></script>
  <script>
    const $ = id => document.getElementById(id);
    const catalog = window.PorcentoCatalogo;
    const invoice = window.PorcentoFactura;
    window.PorcentoBarcode.addButton($('productCode'));
    const editor = $('catalogEditor');
    const number = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
    let products = [];
    let editing = null;
    let saving = false;
    let productPhoto = null;
    let previewUrl;
    let thumbnailUrls = [];
    let photoRequest = 0;

    function showPhoto(photo) {
      const image = $('productPhotoPreview');
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = photo ? URL.createObjectURL(photo) : null;
      image.hidden = !previewUrl;
      if (previewUrl) image.src = previewUrl;
      else image.removeAttribute('src');
    }

    async function resizePhoto(file) {
      const url = URL.createObjectURL(file);
      try {
        const image = new Image();
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
          image.src = url;
        });
        const scale = Math.min(1, 900 / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        return await new Promise((resolve, reject) => {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(Error('Foto ilegible')), 'image/jpeg', .82);
        });
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function selectPhoto(input) {
      const file = input.files?.[0];
      input.value = '';
      if (!file) return;
      const request = ++photoRequest;
      const status = $('photoStatus');
      status.textContent = 'Preparando foto…';
      $('saveProduct').disabled = true;
      try {
        const photo = await resizePhoto(file);
        if (request !== photoRequest) return;
        productPhoto = photo;
        showPhoto(photo);
        status.textContent = '';
      } catch {
        if (request === photoRequest) status.textContent = 'No pude abrir la foto. Toma otra o elige una imagen JPEG o PNG.';
      } finally {
        if (request === photoRequest) $('saveProduct').disabled = false;
      }
    }

    for (const [buttonId, inputId] of [['takeProductPhoto', 'productCameraFile'], ['chooseProductPhoto', 'productPhotoFile']]) {
      const input = $(inputId);
      $(buttonId).onclick = () => input.click();
      input.onchange = () => selectPhoto(input);
    }

    function showProducts() {
      for (const url of thumbnailUrls) URL.revokeObjectURL(url);
      thumbnailUrls = [];
      const query = catalog.searchKey($('catalogSearch').value);
      const matches = products.filter(product => catalog.searchKey(product.name).includes(query) || (product.code || '').includes(query));
      $('catalogEmpty').textContent = matches.length ? '' : query ? 'No se encontraron productos.' : 'Todavía no hay productos guardados.';
      $('catalogList').replaceChildren(...matches.map(product => {
        const row = document.createElement('li');
        row.className = 'row';
        const item = document.createElement('div');
        item.className = 'catalog-item';
        const thumbnail = document.createElement(product.photo ? 'img' : 'span');
        if (product.photo) {
          const url = URL.createObjectURL(product.photo);
          thumbnailUrls.push(url);
          thumbnail.className = 'catalog-thumbnail';
          thumbnail.alt = 'Foto de ' + product.name;
          thumbnail.loading = 'lazy';
          thumbnail.src = url;
        } else {
          thumbnail.className = 'catalog-photo-placeholder';
          thumbnail.setAttribute('aria-hidden', 'true');
          thumbnail.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>';
        }
        const info = document.createElement('div');
        const name = document.createElement('h3');
        name.textContent = product.name;
        const code = document.createElement('p');
        code.className = 'caption';
        code.textContent = product.code;
        code.hidden = !product.code;
        const prices = document.createElement('p');
        prices.className = 'caption';
        prices.textContent = 'Costo por unidad: ' + (product.cost === null ? '—' : number.format(product.cost)) +
          ' · Venta: ' + (product.sale === null ? '—' : number.format(product.sale / 100));
        const purchase = document.createElement('p');
        purchase.className = 'caption';
        purchase.textContent = 'Compra: ' + (product.purchase ? number.format(product.purchase.cents / 100) : '—') +
          ' · Unidades: ' + (product.purchase?.units ?? '—');
        const pending = [!product.photo && 'foto', !product.purchase && 'precio de compra', product.purchase?.units == null && 'unidades', product.sale == null && 'precio de venta'].filter(Boolean);
        const note = document.createElement('p');
        note.className = 'status';
        note.textContent = pending.length ? 'Pendiente: ' + pending.join(', ') + '.' : '';
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = pending.length ? 'Completar' : 'Editar';
        button.setAttribute('aria-label', button.textContent + ' ' + product.name);
        button.onclick = () => openEditor(product);
        info.append(name, code, purchase, prices, note);
        item.append(thumbnail, info);
        row.append(item, button);
        return row;
      }));
    }

    function purchaseValues() {
      const cents = invoice.moneyCents($('productCost').value);
      const units = Number($('productUnits').value);
      return {
        cents: cents !== null && cents >= 0 ? cents : null,
        units: Number.isSafeInteger(units) && units > 0 ? units : null
      };
    }

    function showUnitCost() {
      const { cents, units } = purchaseValues();
      const cost = cents !== null && units !== null ? cents / 100 / units : null;
      $('productUnitCost').textContent = cost !== null ? 'Costo por unidad: ' + number.format(cost) :
        editing?.cost != null ? 'Costo por unidad guardado: ' + number.format(editing.cost) : '';
    }

    async function loadProducts() {
      try {
        products = await catalog.list();
        showProducts();
      } catch {
        $('catalogStatus').textContent = 'El catálogo no está disponible en este navegador.';
      }
    }

    function openEditor(product = null) {
      if (saving) return;
      editing = product;
      photoRequest++;
      productPhoto = product?.photo ?? null;
      showPhoto(productPhoto);
      $('saveProduct').disabled = false;
      $('photoStatus').textContent = '';
      $('editorTitle').textContent = product ? 'Editar producto' : 'Añadir producto';
      $('productName').value = product?.name ?? '';
      $('productCode').value = product?.code ?? '';
      $('productCost').value = product?.purchase ? (product.purchase.cents / 100).toFixed(2) : '';
      $('productUnits').value = product?.purchase?.units ?? '';
      $('productSale').value = product?.sale == null ? '' : (product.sale / 100).toFixed(2);
      showUnitCost();
      $('editorStatus').textContent = '';
      $('deleteProduct').hidden = !product;
      editor.hidden = false;
      $('productName').focus();
    }

    function closeEditor() {
      editing = null;
      photoRequest++;
      productPhoto = null;
      showPhoto(null);
      editor.hidden = true;
      $('newProduct').focus();
    }

    function lockEditor(locked) {
      saving = locked;
      for (const control of editor.elements) control.disabled = locked;
      $('newProduct').disabled = locked;
    }

    $('newProduct').onclick = () => openEditor();
    $('cancelProduct').onclick = closeEditor;
    $('catalogSearch').oninput = showProducts;
    $('productCost').oninput = showUnitCost;
    $('productUnits').oninput = showUnitCost;
    editor.onsubmit = async event => {
      event.preventDefault();
      if (saving || $('saveProduct').disabled) return;
      const costBlank = $('productCost').value.trim() === '';
      const unitsBlank = $('productUnits').value.trim() === '';
      const { cents, units } = purchaseValues();
      const sale = $('productSale').value.trim();
      const saleCents = invoice.moneyCents(sale);
      if (costBlank !== unitsBlank || (!costBlank && (cents === null || units === null))) {
        $('editorStatus').textContent = !costBlank && cents === null ? 'Escribe el precio total de compra, con hasta dos decimales.' :
          !unitsBlank && units === null ? 'Escribe una cantidad entera mayor que cero.' :
          'Escribe el precio total de compra y las unidades, o deja los dos vacíos.';
        return;
      }
      if (sale && (saleCents === null || saleCents < 0)) {
        $('editorStatus').textContent = 'Escribe el precio de venta por unidad, con hasta dos decimales.';
        return;
      }
      const input = {
        name: $('productName').value, code: $('productCode').value, photo: productPhoto,
        cost: costBlank ? null : cents / 100 / units,
        sale: sale ? sale : '',
        purchase: costBlank ? null : { cents, units }
      };
      lockEditor(true);
      try {
        const result = await catalog.save(input, { previousKey: editing?.key, expected: editing?.updated, preserveMissing: true });
        if (result.conflict || result.stale) {
          $('editorStatus').textContent = result.conflict ? 'Ya existe un producto con ese código o nombre. Abre el producto guardado para editarlo.' :
            'El producto cambió. Vuelve a abrirlo desde la lista.';
          await loadProducts();
          return;
        }
        $('catalogStatus').textContent = 'Producto guardado.';
        await loadProducts();
      } catch (error) {
        $('editorStatus').textContent = error.message || 'No se pudo guardar el producto.';
        return;
      } finally {
        lockEditor(false);
      }
      closeEditor();
    };

    $('exportCatalog').onclick = async () => {
      const status = $('catalogStatus');
      try {
        const snapshot = await catalog.exportSnapshot();
        if (!snapshot.products.length) {
          status.textContent = 'Todavía no hay productos para exportar.';
          return;
        }
        const blob = new Blob([JSON.stringify(snapshot)], { type: 'application/json' });
        const outcome = await window.PorcentoBarcode.shareFile('porcento-catalogo.json', blob, 'Catálogo Porcento');
        if (outcome === 'cancelled') return;
        status.textContent = outcome === 'shared' ? 'Copia lista para guardar en Archivos.' : 'Copia descargada.';
      } catch {
        status.textContent = 'No se pudo exportar el catálogo.';
      }
    };
    $('importCatalog').onclick = () => $('importCatalogFile').click();
    $('importCatalogFile').onchange = async () => {
      const input = $('importCatalogFile');
      const file = input.files?.[0];
      input.value = '';
      if (!file) return;
      const status = $('catalogStatus');
      try {
        const data = JSON.parse(await file.text());
        const count = Array.isArray(data.products) ? data.products.length : 0;
        const choice = await window.PorcentoBarcode.choose(
          '¿Restaurar ' + count + (count === 1 ? ' producto' : ' productos') + '? Si ya existen, se actualizan.',
          [{ id: 'restore', label: 'Restaurar', primary: true }, { id: 'cancel', label: 'Cancelar' }]
        );
        if (choice !== 'restore') return;
        const { saved, failed } = await catalog.importSnapshot(data);
        await loadProducts();
        status.textContent = saved + (saved === 1 ? ' producto restaurado.' : ' productos restaurados.') +
          (failed.length ? ' No se pudieron leer: ' + failed.length + '.' : '');
      } catch (error) {
        status.textContent = error instanceof SyntaxError ? 'Ese archivo no es una copia de Porcento.' : (error.message || 'No se pudo leer la copia.');
      }
    };

    $('deleteProduct').onclick = async () => {
      if (!editing) return;
      const choice = await window.PorcentoBarcode.choose(
        '¿Eliminar «' + editing.name + '» del catálogo?',
        [{ id: 'keep', label: 'Conservar', primary: true }, { id: 'delete', label: 'Eliminar', danger: true }]
      );
      if (choice !== 'delete') return;
      lockEditor(true);
      try {
        const deleted = await catalog.remove(editing);
        $('catalogStatus').textContent = deleted ? 'Producto eliminado.' : 'El producto cambió. Revisa la lista.';
        await loadProducts();
      } catch {
        $('editorStatus').textContent = 'No se pudo eliminar el producto.';
        return;
      } finally {
        lockEditor(false);
      }
      closeEditor();
    };

    window.addEventListener('pageshow', loadProducts);
    const draft = new URLSearchParams(location.hash.slice(1));
    if (draft.has('compra') || draft.has('costo')) {
      history.replaceState(null, '', location.pathname + location.search);
      openEditor();
      $('productCost').value = draft.get('compra') ?? '';
      $('productUnits').value = draft.get('unidades') ?? '';
      $('productSale').value = draft.get('venta') ?? '';
      $('productName').value = draft.get('nombre') ?? '';
      showUnitCost();
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
