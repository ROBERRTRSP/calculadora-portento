<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Porcento"><link rel="manifest" href="./manifest.webmanifest"><title>Porcento - Calculadora</title><style>*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,sans-serif;background:#f2f6f3;color:#153c32}body{padding:5px}main{max-width:520px;margin:auto}h1{font-size:21px;margin:1px 0}p{font-size:12px;margin:2px 0 5px}section{background:white;padding:7px 11px;border-radius:11px;margin:5px 0;box-shadow:0 1px 5px #0001}label{display:block;font-size:12px;font-weight:650;margin:4px 0 2px}input{width:100%;height:34px;padding:4px 8px;font-size:17px;border:1px solid #9caea5;border-radius:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}.row:last-child{border:0}.price{font-size:19px;color:#087a51;font-weight:750}small{font-size:10px;color:#566b60}main>small{display:block;line-height:1.2}#custom{background:#e4f5eb}#custom .row{padding:4px 0}@media(max-height:740px){h1{font-size:18px}section{padding:5px 9px;margin:4px 0}input{height:30px;font-size:16px}.row{padding:4px 0}.price{font-size:17px}label{margin:2px 0 1px}}</style></head><body><main><h1>🧮 Porcento</h1><p>Calculadora de precios para tu tienda</p><section><label>Costo de la caja ($)</label><input id="cost" type="number" inputmode="decimal" min="0" step=".01" value="48"><label>Unidades en la caja</label><input id="qty" type="number" inputmode="numeric" min="1" step="1" value="24"><label>Tu precio de venta ($) — opcional</label><input id="sale" type="number" inputmode="decimal" min="0" step=".01" placeholder="Ej. 3.50"></section><section id="custom" hidden></section><section><div class="row"><strong>Costo por unidad</strong><strong id="unit"></strong></div><div id="suggestions"></div></section><small>Los porcentajes son márgenes sobre el precio de venta. Ganancia bruta antes de gastos e impuestos.</small></main><script>const $=x=>document.getElementById(x),money=x=>x.toLocaleString('en-US',{style:'currency',currency:'USD'});function calc(){let c=+$('cost').value,q=+$('qty').value,u=c/q;if(!Number.isFinite(u)||q<=0||c<0){$('unit').textContent='—';$('suggestions').innerHTML='';$('custom').hidden=true;return}$('unit').textContent=money(u);$('suggestions').innerHTML=[33,45,50].map(m=>{let p=Math.ceil((u/(1-m/100)-1e-10)*100)/100;return '<div class="row"><span><b>Margen '+m+'%</b><br><small>Ganas '+money(p-u)+' por unidad</small></span><span class="price">'+money(p)+'</span></div>'}).join('');let v=$('sale').value,p=+v,box=$('custom');box.hidden=v===''||p<=0;if(!box.hidden)box.innerHTML='<strong>Tu precio: '+money(p)+'</strong><div class="row"><span>Margen real</span><b>'+((p-u)/p*100).toFixed(2)+'%</b></div><div class="row"><span>Ganancia por unidad</span><b>'+money(p-u)+'</b></div><div class="row"><span>Ganancia por caja</span><b>'+money((p-u)*q)+'</b></div>'}['cost','qty','sale'].forEach(x=>$(x).addEventListener('input',calc));calc();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
