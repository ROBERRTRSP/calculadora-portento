<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Porcento">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./porcento.css">
  <title>Porcento</title>
  <style>
    .calculator-header { min-height: 44px; margin-bottom: 6px; }
    .calculator-header button { padding-inline: 8px; }
    .unit { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; border-bottom: 1px solid var(--hairline); padding-bottom: 7px; }
    .unit h2 { font-size: 15px; }
    .unit .amount { font-size: 21px; }
    .margin-heading { margin: 8px 0 5px; }
    .margins, .sale-results { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
    .margins > div, .sale-results > div { min-width: 0; }
    .margins > div { background: var(--tint); border-radius: 11px; padding: 6px 5px; text-align: center; }
    .margins .amount { color: var(--accent); display: block; font-size: clamp(18px, 4.7vw, 24px); letter-spacing: -.045em; }
    .margin-label { color: var(--accent); font-size: 12px; font-weight: 680; }
    .profit-label { display: block; }
    .sale-results { border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 7px; }
    .sale-results strong { display: block; }
    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tools a { min-width: 0; background: var(--surface); border: 1px solid var(--hairline); }
    @media (max-width: 350px) { .tools a { gap: 4px; padding-inline: 6px; font-size: 13px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="page-header calculator-header">
      <h1>Porcento</h1>
      <button class="quiet" id="reset" type="button">Limpiar</button>
    </header>

    <form class="card" id="calculator">
      <div class="fields">
        <div class="field">
          <label for="cost">Costo de compra</label>
          <div class="money-input">
            <span aria-hidden="true">$</span>
            <input id="cost" type="number" inputmode="decimal" min="0" step=".01" placeholder="0.00" autocomplete="off" enterkeyhint="next">
          </div>
        </div>
        <div class="field">
          <label for="qty">Unidades <small>(opcional)</small></label>
          <input id="qty" type="number" inputmode="numeric" min="1" step="1" placeholder="1" autocomplete="off" enterkeyhint="next">
        </div>
      </div>
      <div class="field">
        <label for="sale">Tu precio por unidad <small>(opcional)</small></label>
        <div class="money-input">
          <span aria-hidden="true">$</span>
          <input id="sale" type="number" inputmode="decimal" min="0" step=".01" placeholder="0.00" autocomplete="off" enterkeyhint="done">
        </div>
      </div>
      <p class="status" id="inputStatus" role="status"></p>
    </form>

    <section class="card" aria-labelledby="unit-heading">
      <div class="unit">
        <h2 id="unit-heading">Costo por unidad</h2>
        <strong class="amount" id="unit">—</strong>
      </div>
      <h2 class="caption margin-heading">Precio de venta por margen</h2>
      <div class="margins" id="suggestions">
        <div><span class="margin-label">33%</span><strong class="amount">—</strong><small class="profit-label" hidden></small></div>
        <div><span class="margin-label">45%</span><strong class="amount">—</strong><small class="profit-label" hidden></small></div>
        <div><span class="margin-label">50%</span><strong class="amount">—</strong><small class="profit-label" hidden></small></div>
      </div>
      <div class="sale-results" id="custom" hidden>
        <div><small>Margen bruto</small><strong class="amount" id="saleMargin"></strong></div>
        <div><small>Ganancia por unidad</small><strong class="amount" id="saleProfit"></strong></div>
        <div><small>Ganancia total</small><strong class="amount" id="totalProfit"></strong></div>
      </div>
    </section>

    <nav class="tools" aria-label="Herramientas">
      <a class="button" href="./comparador.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V4h4m10 0h4v3M3 17v3h4m10 0h4v-3M7 8v8m3-8v8m4-8v8m3-8v8"/></svg>
        Comparar precios
      </a>
      <a class="button" href="./scanner.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Zm3 5h6m-6 4h6"/></svg>
        Leer factura
      </a>
    </nav>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
    const form = $('calculator');
    const cost = $('cost'), quantity = $('qty'), sale = $('sale');
    const margins = [33, 45, 50];
    const suggestions = [...$('suggestions').children];

    function showAmount(id, text, negative) {
      $(id).textContent = text;
      $(id).classList.toggle('negative', negative);
    }

    function calculate() {
      const units = quantity.value === '' ? 1 : quantity.valueAsNumber;
      const validUnits = !quantity.validity.badInput && Number.isInteger(units) && units > 0;
      const purchase = cost.valueAsNumber;
      const unit = purchase / units;
      const validCost = Number.isFinite(unit) && purchase >= 0 && validUnits;
      $('inputStatus').textContent = !validUnits ? 'Escribe una cantidad entera mayor que cero.'
        : purchase < 0 ? 'El costo debe ser de $0 o más.' : '';
      $('unit').textContent = validCost ? money.format(unit) : '—';

      margins.forEach((margin, index) => {
        const [, amount, profit] = suggestions[index].children;
        const price = Math.ceil((unit / (1 - margin / 100) - 1e-10) * 100) / 100;
        amount.textContent = validCost ? money.format(price) : '—';
        profit.hidden = !validCost;
        profit.textContent = validCost ? money.format(price - unit) + ' ganancia' : '';
      });

      const price = sale.valueAsNumber;
      $('custom').hidden = !(validCost && price > 0);
      if (!$('custom').hidden) {
        const profit = price - unit;
        showAmount('saleMargin', (profit / price * 100).toFixed(1) + '%', profit < 0);
        showAmount('saleProfit', money.format(profit), profit < 0);
        showAmount('totalProfit', money.format(profit * units), profit < 0);
      }
    }

    form.addEventListener('input', calculate);
    form.addEventListener('submit', event => event.preventDefault());
    for (const [current, next] of [[cost, quantity], [quantity, sale], [sale, null]]) {
      current.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        if (next) next.focus();
        else current.blur();
      });
    }
    $('reset').addEventListener('click', () => {
      form.reset();
      calculate();
    });
    calculate();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
