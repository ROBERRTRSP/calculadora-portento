<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Porcento">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./porcento.css?v=27">
  <title>Escanear producto · Porcento</title>
  <style>
    .scan-actions { margin-bottom: 9px; }
    #lookup { align-self: end; }
    #video, #qr-reader { width: 100%; max-height: 270px; background: #141414; border-radius: 12px; overflow: hidden; margin-top: 8px; }
    #name { margin-top: 2px; }
    .product-name { margin-top: 9px; }
    #results { margin-top: 4px; font-size: 14px; }
    .manual-actions { margin-top: 12px; }
  </style>
</head>
<body>
  <main class="app">
    <a class="back" href="./index.html">‹ Porcento</a>
    <header class="page-header"><h1>Escanear producto</h1></header>

    <section class="card" aria-label="Buscar producto">
      <div class="actions scan-actions">
        <button class="primary" id="scan" type="button">Escanear código</button>
        <button id="photoButton" type="button">Leer desde foto</button>
        <button id="stop" type="button" hidden>Cerrar cámara</button>
      </div>
      <input id="photo" type="file" accept="image/*" hidden>
      <video id="video" playsinline muted hidden></video>
      <div id="qr-reader" hidden></div>
      <div class="actions">
        <div class="field">
          <label for="upc">Código de barras</label>
          <input id="upc" inputmode="numeric" autocomplete="off" placeholder="UPC / EAN" enterkeyhint="search">
        </div>
        <button id="lookup" type="button">Buscar</button>
      </div>
      <div class="field product-name" id="productField">
        <label for="name">Producto</label>
        <input id="name" placeholder="Ej. Coca-Cola 20 oz">
      </div>
      <p class="status" id="status" role="status"></p>
    </section>

    <details class="card" id="costDetails" open>
      <summary>Mi costo y precio de venta</summary>
      <div class="details-body">
        <div class="fields">
          <div class="field">
            <label for="cost">Costo de compra ($)</label>
            <input id="cost" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
          </div>
          <div class="field">
            <label for="qty">Unidades <small>(opcional)</small></label>
            <input id="qty" type="number" min="1" step="1" inputmode="numeric" placeholder="1">
          </div>
        </div>
        <div class="field">
          <label for="sale">Tu precio por unidad ($)</label>
          <input id="sale" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
        </div>
        <div id="results"></div>
        <div class="actions manual-actions">
          <button class="primary" id="saveCatalog" type="button">Guardar en Mi catálogo</button>
          <a class="button" href="./catalogo.html">Ver Mi catálogo</a>
          <button class="quiet" id="clear" type="button">Limpiar</button>
        </div>
        <p id="catalogStatus" class="status" role="status"></p>
      </div>
    </details>

  </main>
  <script src="./factura.js?v=27"></script>
  <script src="./catalogo.js?v=27"></script>
  <script src="./barcode.js?v=27"></script>
  <script>
const $ = id => document.getElementById(id);
const usd = n => '$' + n.toFixed(2);
let stream = null, detector = null, raf = 0, html5scanner = null, scanning = false;
function calc() {
  const costText = $('cost').value.trim();
  const qtyText = $('qty').value.trim();
  const saleText = $('sale').value.trim();
  const units = qtyText === '' ? 1 : Number(qtyText);
  const validUnits = Number.isSafeInteger(units) && units > 0;
  const cents = costText === '' ? null : invoice.moneyCents(costText);
  const validCost = cents !== null && cents >= 0 && validUnits;
  const unit = validCost ? cents / 100 / units : null;
  const saleCents = saleText === '' ? null : invoice.moneyCents(saleText);
  const results = $('results');
  results.replaceChildren();
  const add = (label, value) => {
    const row = document.createElement('div');
    row.className = 'row';
    const name = document.createElement('span');
    name.textContent = label;
    const amount = document.createElement('b');
    amount.textContent = value;
    row.append(name, amount);
    results.append(row);
  };
  if (validCost) {
    add('Costo por unidad', usd(unit));
    for (const margin of [33, 45, 50]) {
      const price = unit === 0 ? 0 : invoice.suggestedPrice(costText, units, margin);
      if (price !== null) add('Margen ' + margin + '%', usd(price));
    }
    const markup = invoice.priceWithMarkup(costText, units);
    if (markup !== null) add('Precio con costo +50%', usd(markup));
  }
  if (saleCents !== null && saleCents > 0) {
    const sale = saleCents / 100;
    add('Tu precio', usd(sale));
    if (validCost) {
      add('Ganancia bruta/unidad', usd(sale - unit));
      add('Margen bruto', ((sale - unit) / sale * 100).toFixed(1) + '%');
    }
  }
}

function restore(code, retainDraft = false) {
  currentCode = code;
  catalogRead = false;
  $('status').textContent = '';
  $('catalogStatus').textContent = '';
  let saved;
  try { saved = JSON.parse(localStorage.getItem('porcento_upc_' + code) || 'null'); } catch {}
  for (const id of productFields) {
    if (saved || !retainDraft) $(id).value = saved?.[id] ?? '';
  }
  calc();
}

let currentCode = '';
let catalogRead = false;
let lookupRequest = 0;
const readCode = () => $('upc').value.replace(/[\s-]/g, '');
const catalog = window.PorcentoCatalogo;
const invoice = window.PorcentoFactura;
const productFields = ['name', 'cost', 'qty', 'sale'];
for (const id of ['cost','qty','sale']) $(id).addEventListener('input', calc);

$('saveCatalog').onclick = async () => {
  clearTimeout(lookupDelay);
  const status = $('catalogStatus');
  const name = $('name').value.trim();
  if (!name) {
    status.textContent = 'Escribe el nombre del producto.';
    $('name').focus();
    return;
  }
  const code = readCode();
  const costText = $('cost').value.trim();
  const hasQuantity = $('qty').value.trim() !== '';
  const quantity = hasQuantity ? Number($('qty').value) : 1;
  const cents = costText === '' ? null : invoice.moneyCents(costText);
  if (costText !== '' && (cents === null || cents < 0)) {
    status.textContent = 'Escribe un costo de compra válido, con hasta dos decimales.';
    return;
  }
  if ($('qty').validity?.badInput || (hasQuantity && (!Number.isSafeInteger(quantity) || quantity < 1))) {
    status.textContent = 'Escribe una cantidad entera mayor que cero.';
    return;
  }
  const saleText = $('sale').value.trim();
  if (saleText && invoice.moneyCents(saleText) === null) {
    status.textContent = 'Escribe un precio de venta válido.';
    return;
  }
  const input = {
    name, code, cost: cents === null ? null : invoice.unitCost(costText, quantity),
    sale: saleText,
    purchase: cents === null ? null : { cents, units: hasQuantity ? quantity : null }
  };
  $('saveCatalog').disabled = true;
  try {
    let result = await catalog.save(input, { preserveMissing: true });
    if (result.conflict) {
      const choice = await window.PorcentoBarcode.choose(
        '«' + result.conflict.name + '» ya está en Mi catálogo. ¿Actualizarlo con estos datos?',
        [{ id: 'update', label: 'Actualizar', primary: true }, { id: 'keep', label: 'Conservar' }]
      );
      if (choice !== 'update') {
        status.textContent = 'Se conservó la ficha guardada.';
        return;
      }
      result = await catalog.save(input, { preserveMissing: true, expected: result.conflict.updated });
    }
    if (readCode() === code) {
      status.textContent = result.saved ? 'Producto guardado en Mi catálogo.' : 'La ficha cambió. Vuelve a pulsar Guardar para revisarla.';
    }
  } catch (error) {
    status.textContent = error.message || 'No se pudo guardar el producto.';
  } finally {
    $('saveCatalog').disabled = false;
  }
};

$('clear').onclick = () => {
  for (const id of ['upc',...productFields]) $(id).value = '';
  clearTimeout(lookupDelay);
  lookupRequest++;
  restore('');
};
let lookupDelay=null;
$('upc').addEventListener('input',()=>{clearTimeout(lookupDelay);const upc=$('upc').value.replace(/[\s-]/g,'');if(/^\d{12,14}$/.test(upc)){lookupDelay=setTimeout(()=>{if(readCode()===upc)$('lookup').click()},850)}});
$('upc').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(lookupDelay);$('lookup').click()}});
$('lookup').onclick = async () => {
  clearTimeout(lookupDelay);
  const code = readCode();
  if (!/^\d{8,14}$/.test(code)) {
    $('status').textContent = 'Introduce un código UPC/EAN de 8 a 14 dígitos.';
    return;
  }
  const request = ++lookupRequest;
  const isCurrent = () => request === lookupRequest && readCode() === code;
  $('upc').value = code;
  if (currentCode !== code) restore(code, !currentCode);
  const before = productFields.map(id => $(id).value);
  $('status').textContent = 'Buscando el producto…';
  let saved;
  if (!catalogRead) {
    try {
      saved = await catalog.findByCode(code);
    } catch { /* Web lookup is still available if local storage is unavailable. */ }
  }
  if (!isCurrent()) return;
  catalogRead = true;
  if (saved) {
    const purchase = saved.purchase;
    const values = [saved.name, purchase ? (purchase.cents / 100).toFixed(2) : '', purchase?.units ?? '', saved.sale === null ? '' : (saved.sale / 100).toFixed(2)];
    productFields.forEach((id, i) => {
      if ($(id).value === before[i]) $(id).value = values[i] ?? '';
    });
    const unitNote = !purchase && saved.cost !== null ? ' Costo por unidad guardado: ' + usd(saved.cost) + '.' : '';
    $('catalogStatus').textContent = 'Cargado de Mi catálogo.' + unitNote;
    $('costDetails').open = true;
    calc();
  }
  if ($('name').value.trim()) {
    $('status').textContent = '';
    return;
  }
  let sources=[['Open Food Facts','world.openfoodfacts.org'],['Open Beauty Facts','world.openbeautyfacts.org'],['Open Products Facts','world.openproductsfacts.org']], variants=code.length===12?['0'+code,code]:code.length===13&&code[0]==='0'?[code,code.slice(1)]:[code];let found=false,available=false;for(let [label,domain] of sources){if(found)break;for(let value of variants){let controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),5000);try{let r=await fetch('https://'+domain+'/api/v2/product/'+value+'.json?fields=code,product_name,product_name_en,generic_name,brands,quantity',{signal:controller.signal});if(!r.ok)continue;available=true;let d=await r.json(),p=d.product||{};if(!isCurrent())return;if(d.status!==1)continue;let name=String(p.product_name||p.product_name_en||p.generic_name||'').trim();if(!name)continue;let brand=String(p.brands||'').trim(),quantity=String(p.quantity||'').trim();if (!$('name').value.trim()) $('name').value=[brand&&!name.toLowerCase().includes(brand.toLowerCase())?brand:'',name,quantity].filter(Boolean).join(' · ');$('status').textContent='Identificado en '+label+'.';found=true;break}catch(e){}finally{clearTimeout(timeout)}}}if(!isCurrent())return;if(!found){$('status').textContent=available?'Escribe el nombre si lo conoces.':'Catálogo temporalmente no disponible.'}
};
async function stop(){scanning=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(html5scanner){const scanner=html5scanner;html5scanner=null;try{if(scanner.isScanning)await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}}$('video').hidden=true;$('qr-reader').hidden=true;$('stop').hidden=true;$('scan').hidden=false}
function foundCode(raw){let code=String(raw||'').replace(/\D/g,'');if(!/^\d{8,14}$/.test(code)||!scanning)return;scanning=false;$('upc').value=code;stop();$('lookup').click()}
async function tick(){if(!stream||!scanning)return;try{let matches=await detector.detect($('video'));if(matches.length){foundCode(matches[0].rawValue);if(!scanning)return}}catch(e){}raf=requestAnimationFrame(tick)}
async function nativeCamera(){if(!('BarcodeDetector'in window))throw Error('Lector nativo no disponible');detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('video').srcObject=stream;$('video').hidden=false;await $('video').play();$('status').textContent='Enfoca el código completo y muévelo despacio.';tick()}
$('scan').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='Abre Porcento en Safari o Chrome y concede permiso a la cámara.';return}await stop();scanning=true;$('scan').hidden=true;$('stop').hidden=false;$('status').textContent='Abriendo la cámara trasera…';try{await window.PorcentoBarcode.load();if(!scanning)return;$('qr-reader').hidden=false;html5scanner=window.PorcentoBarcode.createReader('qr-reader');let width=Math.min(320,Math.max(210,Math.floor(window.innerWidth*.78)));await html5scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:width,height:Math.round(width*.42)},disableFlip:true},foundCode,()=>{});$('status').textContent='Coloca el código completo dentro del recuadro.'}catch(e){await stop();scanning=true;$('scan').hidden=true;$('stop').hidden=false;try{await nativeCamera()}catch(e2){await stop();$('status').textContent='No se pudo abrir la cámara. Revisa los permisos o usa «Leer desde foto».'}}};
$('photoButton').onclick=()=>$('photo').click();
$('photo').onchange=async()=>{let file=$('photo').files?.[0];if(!file)return;await stop();scanning=true;$('status').textContent='Leyendo el código de la foto…';try{await window.PorcentoBarcode.load();$('qr-reader').hidden=false;html5scanner=window.PorcentoBarcode.createReader('qr-reader');let code=await html5scanner.scanFile(file,true);foundCode(code);if(scanning){await stop();$('status').textContent='No se encontró un código UPC/EAN en la foto.'}}catch(e){await stop();$('status').textContent='No pude leer la foto. Tómala de cerca, recta y sin reflejos.'}finally{$('photo').value=''}};
$('stop').onclick=stop;window.addEventListener('pagehide',stop);calc();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
