<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./porcento.css">
  <title>Escanear producto · Porcento</title>
  <style>
    .scan-actions { margin-bottom: 9px; }
    #lookup { align-self: end; }
    #name { margin-top: 2px; }
    .product-name { margin-top: 9px; }
    #results { margin-top: 4px; font-size: 14px; }
    .manual-actions { margin-top: 12px; }
  </style>
</head>
<body>
  <main class="app">
    <a class="back" href="./index.html">‹ Porcento</a>
    <header class="page-header"><h1>Escanear producto</h1></header>

    <section class="card" aria-label="Buscar producto">
      <div class="actions scan-actions">
        <button class="primary" id="scan" type="button">Escanear código</button>
        <button id="photoButton" type="button">Leer desde foto</button>
      </div>
      <input id="photo" type="file" accept="image/*" capture="environment" hidden>
      <div id="qr-reader" hidden></div>
      <div class="actions">
        <div class="field">
          <label for="upc">Código de barras</label>
          <input id="upc" inputmode="numeric" autocomplete="off" placeholder="UPC / EAN" enterkeyhint="search">
        </div>
        <button id="lookup" type="button">Buscar</button>
      </div>
      <div class="field product-name" id="productField">
        <label for="name">Producto</label>
        <input id="name" placeholder="Ej. Coca-Cola 20 oz">
      </div>
      <p class="status" id="status" role="status"></p>
      <img id="savedPhoto" alt="Foto del producto" width="88" height="88" style="object-fit:contain" hidden>
      <a class="button" id="openSaved" href="./catalogo.html" hidden>Ver ficha en Mi catálogo</a>
    </section>

    <details class="card" id="costDetails" open>
      <summary>Mi costo y precio de venta</summary>
      <div class="details-body">
        <div class="fields">
          <div class="field">
            <label for="cost">Costo de compra ($)</label>
            <input id="cost" type="number" min="0" step=".01" inputmode="decimal" placeholder="0.00">
          </div>
          <div class="field">
            <label for="qty">Unidades <small>(opcional)</small></label>
            <input id="qty" type="number" min="1" step="1" inputmode="numeric" placeholder="1">
          </div>
        </div>
        <div class="field">
          <label for="sale">Tu precio por unidad ($)</label>
          <input id="sale" type="number" min="0" step=".01" inputmode="decimal" placeholder="0.00">
        </div>
        <p class="status" id="priceInputStatus" role="status"></p>
        <div id="results"></div>
        <div class="actions manual-actions">
          <button class="primary" id="saveCatalog" type="button">Guardar en Mi catálogo</button>
          <a class="button" href="./catalogo.html">Ver Mi catálogo</a>
          <button class="quiet" id="clear" type="button">Limpiar</button>
        </div>
        <p id="catalogStatus" class="status" role="status"></p>
      </div>
    </details>

  </main>
  <script src="./factura.js?v=31"></script>
  <script src="./catalogo.js?v=31"></script>
  <script src="./barcode.js?v=31"></script>
  <script>
const $ = id => document.getElementById(id);
const usd = n => '$' + n.toFixed(2);
function calc() {
  const purchase = $('cost').value;
  const units = $('qty').value === '' ? 1 : Number($('qty').value);
  const validUnits = !$('qty').validity?.badInput && Number.isSafeInteger(units) && units > 0;
  const unit = !validUnits || $('cost').validity?.badInput ? null :
    (recoveredUnitCost && !purchaseEdited && recoveredUnitCost.value === purchase
      ? savedProduct?.cost ?? null : invoice.unitCost(purchase, units));
  const sale = invoice.moneyCents($('sale').value);
  const invalidSale = $('sale').validity?.badInput || ($('sale').value !== '' && (sale === null || sale < 0));
  $('priceInputStatus').textContent = !validUnits ? 'Escribe una cantidad entera mayor que cero.' :
    $('cost').validity?.badInput || (purchase !== '' && unit === null) ? 'Escribe un costo válido con hasta dos decimales.' :
    invalidSale ? 'Escribe un precio de venta válido con hasta dos decimales.' : '';

  const output = [];
  const add = (label, value) => output.push('<div class="row"><span>' + label + '</span><b>' + value + '</b></div>');
  if (unit !== null) {
    add('Costo por unidad', usd(unit));
    // A legacy unit cost without a purchase total is only available as a fractional value.
    if (invoice.moneyCents(purchase) !== null) {
      for (const margin of [33, 45, 50]) add('Margen ' + margin + '%', usd(invoice.suggestedPrice(purchase, units, margin)));
      add('Precio con costo +50%', usd(invoice.priceWithMarkup(purchase, units)));
    }
    if (savedProduct?.cost != null && purchaseEdited) add('Último costo por unidad', usd(savedProduct.cost));
  }
  if (!invalidSale && sale > 0) {
    add('Tu precio', usd(sale / 100));
    if (unit !== null) {
      add('Ganancia bruta/unidad', usd(sale / 100 - unit));
      add('Margen bruto', catalog.grossMargin(unit, sale).toFixed(1) + '%');
    }
  }
  $('results').innerHTML = output.join('');
}

function restore(code, retainDraft = false) {
  currentCode = code;
  showSaved(null);
  purchaseEdited = false;
  recoveredUnitCost = null;
  $('status').textContent = '';
  $('catalogStatus').textContent = '';
  let saved;
  try { saved = JSON.parse(localStorage.getItem('porcento_upc_' + code) || 'null'); } catch {}
  for (const id of productFields) {
    if (saved || !retainDraft) $(id).value = saved?.[id] ?? '';
  }
  calc();
}

let currentCode = '';
let savedProduct = null;
let savedPhotoUrl;
let purchaseEdited = false;

function showSaved(product) {
  savedProduct = product;
  if (savedPhotoUrl) URL.revokeObjectURL(savedPhotoUrl);
  savedPhotoUrl = product?.photo ? URL.createObjectURL(product.photo) : null;
  $('savedPhoto').hidden = !savedPhotoUrl;
  if (savedPhotoUrl) $('savedPhoto').src = savedPhotoUrl;
  else $('savedPhoto').removeAttribute('src');
  $('openSaved').hidden = !product;
  if (product) $('openSaved').href = './catalogo.html#producto=' + encodeURIComponent(product.key);
}
let recoveredUnitCost = null;
let lookupRequest = 0;
const readCode = () => $('upc').value.replace(/[\s-]/g, '');
const catalog = window.PorcentoCatalogo;
const invoice = window.PorcentoFactura;
const productFields = ['name', 'cost', 'qty', 'sale'];
for (const id of ['cost','qty','sale']) $(id).addEventListener('input', () => {
  if (id !== 'sale') purchaseEdited = true;
  calc();
});

$('saveCatalog').onclick = async () => {
  clearTimeout(lookupDelay);
  const status = $('catalogStatus');
  const name = $('name').value.trim();
  if (!name) {
    status.textContent = 'Escribe el nombre del producto.';
    $('name').focus();
    return;
  }
  const code = readCode();
  const costText = $('cost').value;
  const hasQuantity = $('qty').value !== '';
  const quantity = hasQuantity ? Number($('qty').value) : 1;
  const keepUnitCost = recoveredUnitCost?.code === code && recoveredUnitCost.value === costText && !hasQuantity && !purchaseEdited;
  const cents = costText === '' || keepUnitCost ? null : invoice.moneyCents(costText);
  if ($('cost').validity?.badInput || (!keepUnitCost && costText !== '' && (cents === null || cents < 0))) {
    status.textContent = 'Escribe un costo de compra válido, con hasta dos decimales.';
    return;
  }
  if ($('qty').validity?.badInput || !Number.isSafeInteger(quantity) || quantity < 1) {
    status.textContent = 'Escribe una cantidad entera mayor que cero.';
    return;
  }
  if ($('sale').validity?.badInput) {
    status.textContent = 'Escribe un precio de venta válido.';
    return;
  }
  const input = {
    name, code, cost: cents === null ? null : invoice.unitCost(costText, quantity),
    sale: $('sale').value,
    purchase: cents === null ? null : { cents, units: hasQuantity ? quantity : null }
  };
  $('saveCatalog').disabled = true;
  try {
    const record = cents !== null && purchaseEdited ? {} : undefined;
    const options = savedProduct && catalog.barcodeKey(savedProduct.code) === catalog.barcodeKey(code)
      ? { preserveMissing: true, expected: savedProduct.updated, record }
      : { preserveMissing: true, record };
    let result = await catalog.save(input, options);
    if (result.conflict) {
      if (!confirm('«' + result.conflict.name + '» ya está en Mi catálogo. ¿Actualizarlo con estos datos?')) {
        status.textContent = 'Se conservó la ficha guardada.';
        return;
      }
      result = await catalog.save(input, { ...options, expected: result.conflict.updated });
    }
    if (readCode() === code) {
      if (result.saved) {
        currentCode = code;
        showSaved(result.saved);
        purchaseEdited = false;
        $('status').textContent = 'Ya está en Mi catálogo.';
        calc();
      }
      status.textContent = result.saved ? 'Producto guardado en Mi catálogo.' : 'La ficha cambió. Busca el producto otra vez antes de guardar.';
    }
  } catch (error) {
    status.textContent = error.message || 'No se pudo guardar el producto.';
  } finally {
    $('saveCatalog').disabled = false;
  }
};

$('clear').onclick = () => {
  for (const id of ['upc',...productFields]) $(id).value = '';
  clearTimeout(lookupDelay);
  lookupRequest++;
  restore('');
};
let lookupDelay;
$('upc').addEventListener('input', () => {
  clearTimeout(lookupDelay);
  lookupRequest++;
  const code = readCode();
  if (catalog.barcodeKey(code) !== catalog.barcodeKey(currentCode)) {
    if (savedProduct) restore('');
    $('status').textContent = '';
    $('catalogStatus').textContent = '';
  }
  if (/^\d{8,14}$/.test(code)) lookupDelay = setTimeout(() => lookupProduct(true), 400);
});
$('upc').addEventListener('keydown', event => {
  if (event.key === 'Enter') lookupProduct();
});
$('lookup').onclick = () => lookupProduct();
async function lookupProduct(automatic = false) {
  clearTimeout(lookupDelay);
  const code = readCode();
  if (!/^\d{8,14}$/.test(code)) {
    $('status').textContent = 'Introduce un código UPC/EAN de 8 a 14 dígitos.';
    return;
  }
  const request = ++lookupRequest;
  const isCurrent = () => request === lookupRequest && readCode() === code;
  if (!automatic) $('upc').value = code;
  if (!automatic && currentCode !== code && catalog.barcodeKey(currentCode) !== catalog.barcodeKey(code)) {
    restore(code, !currentCode);
  }
  const before = productFields.map(id => $(id).value);
  $('status').textContent = 'Buscando en Mi catálogo…';
  let saved;
  try {
    saved = await catalog.findByCode(code);
  } catch {
    if (isCurrent()) $('status').textContent = 'No pude abrir Mi catálogo. Vuelve a buscar.';
    return;
  }
  if (!isCurrent()) return;
  if (!saved) {
    if (!automatic && currentCode && catalog.barcodeKey(currentCode) !== catalog.barcodeKey(code)) restore(code);
    showSaved(null);
    $('status').textContent = 'Este código todavía no está en Mi catálogo.';
    return;
  }
  const sameProduct = savedProduct?.key === saved.key;
  if (!sameProduct) purchaseEdited = false;
  currentCode = code;
  const purchase = saved.purchase;
  const values = [saved.name, purchase ? (purchase.cents / 100).toFixed(2) : saved.cost, purchase?.units,
    saved.sale === null ? '' : (saved.sale / 100).toFixed(2)];
  productFields.forEach((id, index) => {
    if ($(id).value === before[index] && !(sameProduct && purchaseEdited && (id === 'cost' || id === 'qty'))) {
      $(id).value = values[index] ?? '';
    }
  });
  recoveredUnitCost = !purchase && saved.cost !== null ? { code, value: String(saved.cost) } : null;
  showSaved(saved);
  $('status').textContent = 'Ya está en Mi catálogo.';
  $('catalogStatus').textContent = '';
  $('costDetails').open = true;
  calc();
}
const barcode = window.PorcentoBarcode;
$('scan').onclick = () => barcode.scanInto($('upc'), () => lookupProduct());
$('photoButton').onclick = () => $('photo').click();
$('photo').onchange = async () => {
  const file = $('photo').files?.[0];
  if (!file) return;
  $('photo').value = '';
  $('scan').disabled = $('photoButton').disabled = true;
  $('status').textContent = 'Leyendo el código de la foto…';
  const request = ++lookupRequest;
  clearTimeout(lookupDelay);
  let reader;
  try {
    await barcode.load();
    $('qr-reader').hidden = false;
    reader = barcode.createReader('qr-reader');
    const code = await reader.scanFile(file, false);
    if (request !== lookupRequest) return;
    if (!/^\d{8,14}$/.test(code)) {
      $('status').textContent = 'La foto no muestra un código UPC o EAN legible.';
      return;
    }
    $('upc').value = code;
    await lookupProduct();
  } catch {
    if (request === lookupRequest) $('status').textContent = 'No pude leer la foto. Tómala de cerca, recta y sin reflejos.';
  } finally {
    try { reader?.clear(); } catch { /* It may already be cleared. */ }
    $('qr-reader').hidden = true;
    $('scan').disabled = $('photoButton').disabled = false;
  }
};
calc();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
if (new URLSearchParams(location.search).get('escanear') === '1') $('scan').click();
  </script>
</body>
</html>
